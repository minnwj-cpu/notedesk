<script>
(function(){
  function blobOf(filename,data){
    if(data instanceof Blob) return data;
    if(data instanceof ArrayBuffer||ArrayBuffer.isView(data)) return new Blob([data]);
    var ext=(String(filename).split(".").pop()||"").toLowerCase();
    var mt={md:"text/markdown",ics:"text/calendar",txt:"text/plain",json:"application/json",csv:"text/csv",html:"text/html"}[ext]||"application/octet-stream";
    return new Blob([String(data)],{type:mt+";charset=utf-8"});
  }
  function viaAnchor(blob,filename){
    var u=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=u; a.download=filename; a.rel="noopener"; a.style.display="none";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ a.remove(); URL.revokeObjectURL(u); },60000);
  }
  window.__stdDownloads={
    save:function(o){
      var filename=o.filename, blob=blobOf(filename,o.data);
      var touch=("ontouchstart" in window)||navigator.maxTouchPoints>0;
      var file=null; try{ file=new File([blob],filename,{type:blob.type||"application/octet-stream"}); }catch(e){}
      /* 아이패드: 공유 시트로 — 「파일에 저장」·드라이브 앱으로 바로 보낸다. 취소하면 declined */
      if(touch&&file&&navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
        return navigator.share({files:[file],title:filename}).then(function(){ return {ok:true}; })
          .catch(function(e){
            if(e&&e.name==="AbortError"){ var err=new Error("취소"); err.code="declined"; throw err; }
            viaAnchor(blob,filename); return {ok:true};
          });
      }
      viaAnchor(blob,filename); return Promise.resolve({ok:true});
    }
  };
  if("serviceWorker" in navigator){
    window.addEventListener("load",function(){
      navigator.serviceWorker.register("../sw.js").catch(function(e){ console.warn("serviceWorker",e); });
    });
  }
})();
</script>
</head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="../vendor/jszip.min.js"></script>

<style>
:root{
  --ink:#1B1F24; --ink-2:#333A42; --paper:#F1F2EE; --surface:#FFFFFF;
  --surface-2:#F6F7F4; --line:#D4D8D0; --line-2:#E4E7E1;
  --mute:#6B7369; --mute-2:#8C9389;
  --brand:#1F5F5B; --brand-soft:#E4EFED;
  --seal:#B23B2E; --seal-soft:#FBEEEC;
  --pen:#2C4E7A; --pen-soft:#EAF0F7;
  --court:#4A3B6B; --court-soft:#F0ECF6;
  --ok:#2F6B4F; --ok-soft:#E9F3ED;
  --warn:#B85C00; --warn-soft:#FBEFE0;
  --fix:#B85C00;
  --shadow:0 1px 2px rgba(27,31,36,.06), 0 6px 18px rgba(27,31,36,.06);
  --shadow-lg:0 8px 40px rgba(27,31,36,.18);
  --r:10px;
  --serif:"Gowun Batang","Nanum Myeongjo",'Apple SD Gothic Neo',serif;
  --sans:"Noto Sans KR",'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#E8ECE9; --ink-2:#BBC3BE; --paper:#12171A; --surface:#1B2226;
    --surface-2:#161D20; --line:#2E393E; --line-2:#252F33;
    --mute:#93A09A; --mute-2:#6F7B76;
    --brand:#6FBFB7; --brand-soft:#16302E;
    --seal:#E0705F; --seal-soft:#2E1E1C;
    --pen:#7EA6D6; --pen-soft:#18242F;
    --court:#AC98D6; --court-soft:#221E2E;
    --ok:#6FC195; --ok-soft:#16241D;
    --warn:#E0A05A; --warn-soft:#2A2013;
    --fix:#E0A05A;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
    --shadow-lg:0 8px 40px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ink:#E8ECE9; --ink-2:#BBC3BE; --paper:#12171A; --surface:#1B2226;
  --surface-2:#161D20; --line:#2E393E; --line-2:#252F33;
  --mute:#93A09A; --mute-2:#6F7B76;
  --brand:#6FBFB7; --brand-soft:#16302E;
  --seal:#E0705F; --seal-soft:#2E1E1C;
  --pen:#7EA6D6; --pen-soft:#18242F;
  --court:#AC98D6; --court-soft:#221E2E;
  --ok:#6FC195; --ok-soft:#16241D;
  --warn:#E0A05A; --warn-soft:#2A2013;
  --fix:#E0A05A;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
  --shadow-lg:0 8px 40px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;
  -webkit-text-size-adjust:100%;overscroll-behavior:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.app{display:flex;flex-direction:column;height:100dvh;min-height:0}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:9px 16px;background:var(--surface);
  border-bottom:1px solid var(--line);padding-top:max(9px,env(safe-area-inset-top))}
.brand{display:flex;align-items:baseline;gap:9px}
.brand b{font-family:var(--serif);font-weight:700;font-size:19px;letter-spacing:-.01em;color:var(--brand)}
.brand span{font-size:10.5px;color:var(--mute-2);letter-spacing:.14em;text-transform:uppercase}
.caseline{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1;flex-wrap:wrap}
.caseline .nm{font-family:var(--serif);font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.caseno{font-family:var(--mono);font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.top .right{display:flex;align-items:center;gap:8px;margin-left:auto}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:100px;font-size:11.5px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.badge.exam{background:var(--court-soft);color:var(--court);border-color:color-mix(in srgb,var(--court) 22%,transparent)}
.badge.demo{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 25%,transparent)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:8px;border:1px solid var(--line);background:var(--surface);
  font-size:13px;font-weight:500;min-height:36px;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.primary:hover{opacity:.92;background:var(--brand)}
.btn.seal{background:var(--seal);color:#fff;border-color:var(--seal)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:4px 9px;min-height:29px;font-size:12px}
.btn[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.fixb[aria-pressed="true"]{background:var(--fix);border-color:var(--fix)}

.tabs{display:flex;gap:2px;background:var(--surface);border-bottom:1px solid var(--line);padding:0 10px;overflow-x:auto}
.tab{padding:9px 13px 8px;font-size:13.5px;font-weight:500;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap;min-height:40px;display:flex;align-items:center;gap:7px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand);font-weight:600}
.tab .n{font-family:var(--mono);font-size:10.5px;padding:1px 5px;border-radius:100px;background:var(--surface-2);color:var(--mute);border:1px solid var(--line-2)}
.tab[aria-selected="true"] .n{background:var(--brand-soft);color:var(--brand);border-color:transparent}

.main{flex:1;min-height:0;display:flex;overflow:hidden}
.pane{display:none;flex:1;min-width:0;min-height:0}
.pane.on{display:flex}
.cols{flex:1;overflow-y:auto;padding:16px;min-height:0;-webkit-overflow-scrolling:touch}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sectionhd{display:flex;align-items:baseline;gap:10px;margin:6px 0 0}
.sectionhd h2{font-family:var(--serif);font-size:17px;font-weight:700;margin:0}
.sectionhd .c{font-family:var(--mono);font-size:12px;color:var(--mute)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card .hd{display:flex;align-items:flex-start;gap:10px;padding:12px 15px;border-bottom:1px solid var(--line-2)}
.card .hd h3{margin:0;font-family:var(--serif);font-size:16px;font-weight:700;flex:1;line-height:1.4}
.card .bd{padding:6px 15px 13px}
.hint{font-size:12.5px;color:var(--mute-2);padding:18px 14px;line-height:1.6}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;padding:40px 24px;text-align:center;color:var(--mute)}
.empty h2{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--ink);margin:0}
.empty p{margin:0;font-size:14px;max-width:44ch;line-height:1.65}

/* 한눈에 */
.examgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.examgrid .cell{padding:10px 14px;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}
.examgrid .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute-2);font-weight:600}
.examgrid .v{font-size:14px;margin-top:2px;line-height:1.45}
.oneline{background:var(--brand-soft);border:1px solid color-mix(in srgb,var(--brand) 25%,transparent);border-radius:var(--r);padding:16px 20px;font-family:var(--serif);font-size:17.5px;line-height:1.6;color:var(--ink);text-wrap:balance}
.oneline b{color:var(--brand)}
.point{display:grid;grid-template-columns:1fr;gap:0}
.point .q{font-family:var(--serif);font-size:15.5px;font-weight:700;line-height:1.5;padding:12px 15px 6px}
.point .row{display:grid;grid-template-columns:78px 1fr;gap:10px;padding:6px 15px;font-size:14px;line-height:1.55}
.point .row .k{font-size:11px;font-weight:600;color:var(--mute);letter-spacing:.06em;padding-top:3px}
.point .row.ans{background:var(--ok-soft);padding:10px 15px 12px}
.point .row.ans .k{color:var(--ok)}
.point+.point{border-top:1px solid var(--line-2)}
table.g{border-collapse:collapse;width:100%;font-size:13.5px}
table.g th,table.g td{border-top:1px solid var(--line-2);padding:8px 10px;text-align:left;vertical-align:top;line-height:1.5}
table.g th{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--mute);background:var(--surface-2);border-top:none}
table.g td.no{color:var(--seal);font-weight:600}
table.g td.yes{color:var(--ok)}
table.g td.past{color:var(--mute);font-style:normal}
.twrap{overflow-x:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;display:flex;flex-direction:column;gap:3px}
.stat .k{font-size:11px;letter-spacing:.08em;color:var(--mute);font-weight:600}
.stat .v{font-family:var(--mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.stat .s{font-size:12px;color:var(--mute);line-height:1.45}
.stat .w{font-size:12px;color:var(--warn);line-height:1.45;margin-top:3px;padding-top:4px;border-top:1px dashed color-mix(in srgb,var(--warn) 40%,transparent)}
.stat.warn{border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.spot{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;padding:9px 15px;border-top:1px solid var(--line-2);align-items:start}
.spot:first-child{border-top:none}
.spot .pg{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--pen);background:var(--pen-soft);padding:3px 8px;border-radius:6px;white-space:nowrap;min-height:28px;display:inline-flex;align-items:center}
.spot .pg:hover{background:var(--pen);color:#fff}
.spot .lb{font-weight:600;font-size:14px;line-height:1.45}
.spot .tx{grid-column:2;font-size:13px;color:var(--ink-2);line-height:1.5}
.chk{width:22px;height:22px;flex:0 0 22px;border:1.5px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent;margin-top:1px}
.chk[aria-checked="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.ck{display:flex;align-items:flex-start;gap:11px;padding:10px 15px;border-top:1px solid var(--line-2)}
.ck:first-child{border-top:none}
.ck .body{flex:1;min-width:0}
.ck .t{font-size:14px;line-height:1.5}
.ck.done .t{color:var(--mute-2);text-decoration:line-through}
.ck .n{font-size:12px;color:var(--mute);margin-top:2px}
.ck .m{display:flex;gap:9px;align-items:center;margin-top:5px;flex-wrap:wrap}
.due{font-family:var(--mono);font-size:11.5px;padding:2px 7px;border-radius:5px;background:var(--surface-2);color:var(--mute);border:1px solid var(--line-2)}
.due.soon{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.due.over{background:var(--seal-soft);color:var(--seal);border-color:transparent}
a.pref,button.pref{font-family:var(--mono);font-size:12.5px;color:var(--pen);text-decoration:none;border-bottom:1px dashed color-mix(in srgb,var(--pen) 45%,transparent);cursor:pointer;padding:0}
a.pref:hover,button.pref:hover{color:var(--seal);border-bottom-color:var(--seal)}

/* 브리핑 */
.sum{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 24px;line-height:1.72;font-size:14.5px;max-width:78ch}
.sum h1{font-family:var(--serif);font-size:21px;margin:0 0 6px;line-height:1.35}
.sum h2{font-family:var(--serif);font-size:16.5px;margin:22px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line-2)}
.sum h3{font-size:14.5px;margin:16px 0 4px;color:var(--brand)}
.sum h4{font-size:14px;margin:12px 0 3px;color:var(--ink-2)}
.sum p{margin:6px 0}
.sum ul,.sum ol{margin:4px 0 8px;padding-left:22px}
.sum li{margin:3px 0}
.sum blockquote{margin:8px 0;padding:8px 14px;border-left:3px solid var(--brand);background:var(--brand-soft);border-radius:0 6px 6px 0}
.sum table{border-collapse:collapse;margin:8px 0;font-size:13.5px;display:block;overflow-x:auto}
.sum th,.sum td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
.sum th{background:var(--surface-2);font-weight:600}
.sum code{font-family:var(--mono);font-size:12.5px;background:var(--surface-2);padding:1px 5px;border-radius:4px}
.sum .meta{font-family:var(--mono);font-size:11px;color:var(--mute-2);margin-top:14px}

/* 문답 */
.qa{flex:1;display:flex;min-height:0;min-width:0}
.qlist{width:340px;flex:0 0 340px;border-right:1px solid var(--line);background:var(--surface);overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch}
.qitem{display:grid;grid-template-columns:14px 1fr;gap:10px;width:100%;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line-2);border-left:3px solid transparent;align-items:start}
.qitem:hover{background:var(--surface-2)}
.qitem[aria-current="true"]{background:var(--brand-soft);border-left-color:var(--brand)}
.qitem .dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line);margin-top:6px}
.qitem.asked .dot{background:var(--ok);border-color:var(--ok)}
.qitem.dev .dot{background:var(--fix);border-color:var(--fix)}
.qitem .t{font-size:13.5px;line-height:1.45}
.qitem .tag{font-size:10.5px;font-weight:600;letter-spacing:.06em;color:var(--mute);display:block;margin-bottom:2px}
.qitem .tag.검사지적{color:var(--court)} .qitem .tag.함정{color:var(--seal)}
.qdetail{flex:1;min-width:0;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.qcard{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.qcard .qh{display:flex;flex-direction:column;gap:8px}
.qcard .qh .tagline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tagchip{font-size:11px;font-weight:600;letter-spacing:.06em;padding:2px 8px;border-radius:100px;background:var(--surface-2);color:var(--mute);border:1px solid var(--line-2)}
.tagchip.검사지적{background:var(--court-soft);color:var(--court);border-color:transparent}
.tagchip.함정{background:var(--seal-soft);color:var(--seal);border-color:transparent}
.tagchip.기본{background:var(--brand-soft);color:var(--brand);border-color:transparent}
.qcard h2{font-family:var(--serif);font-size:19px;font-weight:700;margin:0;line-height:1.45;text-wrap:balance}
.qacts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qsec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.qsec .h{font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--mute);padding:8px 15px 0}
.qsec .b{padding:6px 15px 13px;font-size:14.5px;line-height:1.7;white-space:pre-wrap}
.qsec.ans{border-color:color-mix(in srgb,var(--ok) 35%,transparent)} .qsec.ans .h{color:var(--ok)}
.qsec.prev .b{color:var(--ink-2);font-size:14px}
.qsec.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)} .qsec.warn .h{color:var(--warn)} .qsec.warn .b{color:var(--ink)}
.srcs{display:flex;flex-wrap:wrap;gap:6px;padding:6px 15px 13px}
.srcchip{font-family:var(--mono);font-size:12px;font-weight:500;padding:4px 9px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);min-height:30px;display:inline-flex;align-items:center;gap:6px}
.srcchip:hover{border-color:var(--pen);color:var(--pen)}
.srcchip i{font-style:normal;font-family:var(--sans);font-size:11.5px;color:var(--mute)}
.actual textarea{width:100%;resize:vertical;min-height:64px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-size:14.5px;line-height:1.5}
.qback{display:none}
@media (max-width:900px){
  .qlist{width:100%;flex:1 1 auto;border-right:none}
  .qa.detail .qlist{display:none}
  .qa:not(.detail) .qdetail{display:none}
  .qback{display:inline-flex}
}

/* 기록 */
.reclist{width:300px;flex:0 0 300px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.searchwrap{padding:9px 11px;border-bottom:1px solid var(--line-2)}
.searchwrap input{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface-2);font-size:13px;min-height:34px}
.searchwrap input::placeholder{color:var(--mute-2)}
.scroll{overflow-y:auto;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.grouphd{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute-2);font-weight:600;padding:13px 13px 5px}
.docitem{display:block;width:100%;text-align:left;padding:9px 13px;border-left:3px solid transparent;border-bottom:1px solid var(--line-2)}
.docitem:hover{background:var(--surface-2)}
.docitem[aria-current="true"]{background:var(--pen-soft)}
.docitem .t{font-size:13.5px;font-weight:500;line-height:1.35;margin-bottom:3px}

<script>
"use strict";
/* ══ 저장소 ═══════════════════════════════════════════════════════ */
const DB_NAME="josanote", DB_VER=1;
const STORES=["cases","blobs","notes","qa","checks","todos","hl"];
let _db=null;
function db(){
  if(_db) return Promise.resolve(_db);
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,DB_VER);
    r.onupgradeneeded=()=>{ const d=r.result;
      STORES.forEach(s=>{ if(!d.objectStoreNames.contains(s)) d.createObjectStore(s,{keyPath:"k"}); }); };
    r.onsuccess=()=>{ _db=r.result; res(_db); };
    r.onerror=()=>rej(r.error);
  });
}
async function put(store,k,v){ const d=await db();
  return new Promise((res,rej)=>{ const t=d.transaction(store,"readwrite"); t.objectStore(store).put({k,v}); t.oncomplete=res; t.onerror=()=>rej(t.error); }); }
async function putMany(store,rows){ const d=await db();
  return new Promise((res,rej)=>{ const t=d.transaction(store,"readwrite"), o=t.objectStore(store); rows.forEach(r=>o.put({k:r.k,v:r.v})); t.oncomplete=res; t.onerror=()=>rej(t.error); }); }
async function delMany(store,keys){ const d=await db();
  return new Promise((res,rej)=>{ const t=d.transaction(store,"readwrite"), o=t.objectStore(store); keys.forEach(k=>o.delete(k)); t.oncomplete=res; t.onerror=()=>rej(t.error); }); }
async function get(store,k){ const d=await db();
  return new Promise((res,rej)=>{ const r=d.transaction(store,"readonly").objectStore(store).get(k); r.onsuccess=()=>res(r.result?r.result.v:null); r.onerror=()=>rej(r.error); }); }
async function all(store){ const d=await db();
  return new Promise((res,rej)=>{ const r=d.transaction(store,"readonly").objectStore(store).getAll(); r.onsuccess=()=>res((r.result||[]).map(x=>({k:x.k,v:x.v}))); r.onerror=()=>rej(r.error); }); }

window.addEventListener("error",e=>{ try{ toast("오류: "+(e.message||e.error||"알 수 없음"),6000); }catch(x){} });
window.addEventListener("unhandledrejection",e=>{ try{ const r=e.reason; toast("오류: "+((r&&(r.message||r.name))||String(r)),6000); }catch(x){} });

/* ══ 상태 ═════════════════════════════════════════════════════════ */
const S={ caseId:null, cases:{}, docs:[], keys:{}, notes:[], qa:{}, checks:{}, todos:[],
          who:"수사관", doc:null, page:1, pages:0, zoomIdx:1, url:null, pre:null, qid:null };
const ZOOMS=["fit",100,125,150,200,300];
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const SIDE_CLS={"고소인":"s-p","피의자":"s-d","수사기관":"s-c","기타":"s-x"};
const sideCls=v=>SIDE_CLS[v]||"";
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const hhmm=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");};
const kdate=s=>{ if(!s) return ""; const[y,m,d]=String(s).split("-"); return d?`${y}. ${+m}. ${+d}.`:s; };
const pad4=n=>String(n).padStart(4,"0");
const today=()=>new Date().toISOString().slice(0,10);
function toast(msg,ms=2600){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),ms); }
function daysTo(iso){ if(!iso) return null; const a=new Date(iso+"T00:00:00"), b=new Date(); b.setHours(0,0,0,0); return Math.round((a-b)/864e5); }
function setProg(p){ $("#prog").style.width=(p*100)+"%"; if(p>=1) setTimeout(()=>setProg(0),600); }
const cur=()=>S.cases[S.caseId]||{};
const ourSide=()=>cur().side||"고소인";

/* ══ 예시 사건 ════════════════════════════════════════════════════ */
const DEMO_ID="demo";
function demoCase(){
  return { id:DEMO_ID, name:"보기용 예시 — 사기 고소대리인 조사", caseNo:"○○경찰서 2026-000000", agency:"○○경찰서 수사과", side:"고소인", demo:true,
    exam:{date:today(),time:"14:00",place:"○○경찰서 수사과",officer:"○○○ 경위",kind:"고소대리인 진술",who:"고소인 대표",me:"변호사 동석"},
    briefing:"# 예시 브리핑\n\n조사팩을 열면 사건 폴더의 조사대비안내가 여기 뜹니다. `조서1 4면` 같은 표기는 그 면으로 갑니다.",
    glance:{ 한줄:"이번 조사에서 정리하고 나올 한 줄을 여기 적는다.",
      검사지적:[{q:"검사가 확인하라고 한 것",why:"왜 나왔는지",ans:"정리해서 나올 답"}],
      금지표현:[{금지:"「추측입니다」",대신:"「자료에 비추어 판단한 것입니다」",why:"조서에 그대로 남는다"}],
      함정:[{q:"지난 조서에서 당한 질문",지난답:"지난 답",이번답:"이번 답"}],
      숫자:[{k:"편취액",v:"0원",sub:"출처"}],
      짚을자료:[] },

async function importPack(file){
  setProg(.03);
  const zip=await JSZip.loadAsync(file);
  const pj=zip.file("pack.json");
  if(!pj) throw new Error("pack.json이 없습니다. 조사팩 zip이 맞는지 확인하세요.");
  const pack=JSON.parse(await pj.async("string"));
  if(pack.app!=="조사노트") throw new Error("조사노트 팩이 아닙니다"+(pack.v?" (기일팩?)":"")+".");
  const cid=pack.case.id;
  const prev=(await get("cases",cid))||null;
  let docs=(prev&&prev.docs)?[...prev.docs]:[];
  const have=new Set(docs.map(d=>d.uid));
  const list=pack.docs||[];
  const totalPages=list.reduce((s,d)=>s+(d.pages||0),0)||1;
  let done=0, added=0; const replaced=[];
  for(const d of list){
    const u=cid+"/"+d.sha;
    if(have.has(u)){ done+=d.pages||0; continue; }
    for(const old of docs.filter(x=>x.uid!==u&&x.src&&d.src&&x.src===d.src)){ await supersede(old,u,d.pages||0); replaced.push(old.uid); }
    let batch=[];
    for(let p=1;p<=d.pages;p++){
      const f=zip.file(`${d.dir}/${pad4(p)}.jpg`);
      if(f) batch.push({k:u+"#"+p, v:await f.async("arraybuffer")});
      done++;
      if(batch.length>=100){ await putMany("blobs",batch); batch=[]; setProg(.03+.94*(done/totalPages)); }
    }
    if(batch.length) await putMany("blobs",batch);
    setProg(.03+.94*(done/totalPages));
    docs.push({ uid:u, key:d.key, name:d.name, side:d.side||"기타", date:d.date, kind:d.kind, pages:d.pages, w:d.w, h:d.h,
                sentOn:pack.exam.date, text:d.text||[], toc:d.toc||[], src:d.src||null, sha:d.sha });
    added++;
  }
  if(replaced.length) docs=docs.filter(x=>!replaced.includes(x.uid));
  (pack.known||[]).forEach(k=>{ const d=docs.find(x=>x.src===k.src); if(d){ if(k.key) d.key=k.key; if(k.name) d.name=k.name; if(k.side) d.side=k.side; if(k.toc&&k.toc.length) d.toc=k.toc; } });
  const keys={}; docs.forEach(d=>{ if(d.key) keys[d.key]=d.uid; });
  const meta={ id:cid, name:pack.case.name, folder:pack.case.folder, caseNo:pack.case.caseNo, agency:pack.case.agency, side:pack.case.side||"고소인",
    exam:pack.exam, briefing:pack.briefing!=null?pack.briefing:(prev&&prev.briefing)||null, briefingAt:pack.briefingAt||(prev&&prev.briefingAt)||null,
    glance:pack.glance||(prev&&prev.glance)||{}, qa:pack.qa||(prev&&prev.qa)||[], checks:pack.checks||(prev&&prev.checks)||{},
    builtAt:pack.builtAt, exams:[...((prev&&prev.exams)||[]),pack.exam].filter((h,i,a)=>a.findIndex(x=>x.date===h.date)===i).sort((a,b)=>a.date<b.date?-1:1),
    docs, keys };
  await put("cases",cid,meta);
  setProg(1);
  await loadCases(cid);
  goTab("glance");
  toast(added?`기록 ${added}건 · ${totalPages}면 들어왔습니다`+(replaced.length?` · 옛 판 ${replaced.length}건 교체`:"")+` · 문답 ${(pack.qa||[]).length}`
             :`기록은 그대로 · 브리핑·문답·체크를 갱신했습니다`,4200);
}
async function supersede(old,nu,npages){
  const keep=Math.min(old.pages||0,npages||0), hlOld=[], blobOld=[];
  for(let p=1;p<=(old.pages||0);p++){
    blobOld.push(old.uid+"#"+p); hlOld.push("hl:"+old.uid+"#"+p);
    if(p<=keep){ try{ const v=await get("hl","hl:"+old.uid+"#"+p); if(v&&v.length) await put("hl","hl:"+nu+"#"+p,v); }catch(e){} }
  }
  try{ await delMany("blobs",blobOld); await delMany("hl",hlOld); }catch(e){ console.error(e); }
}

function keyRegex(){
  const names=[]; Object.keys(S.keys).forEach(k=>{ names.push(k); const b=k.replace(/\d+$/,""); if(b&&b!==k&&!S.keys[b]) names.push(b); });
  if(!names.length) return null;
  names.sort((a,b)=>b.length-a.length);
  return new RegExp("("+names.map(n=>n.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")\\s*(\\d{1,4})면","g");
}
function keyUid(name){ if(S.keys[name]) return S.keys[name]; const k=Object.keys(S.keys).find(x=>x.replace(/\d+$/,"")===name); return k?S.keys[k]:null; }
function linkify(t){
  t=esc(t);
  t=t.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>");
  const re=keyRegex(); if(!re) return t;
  return t.replace(re,(m,name,p)=>{ const u=keyUid(name); return u?`<a class="pref" data-uid="${esc(u)}" data-p="${p}">${m}</a>`:m; });
}

/* ══ 브리핑 ═══════════════════════════════════════════════════════ */
function mdToHtml(md){
  const lines=md.replace(/\r/g,"").split("\n"); let h="", list=null, para=[], table=null, quote=[];
  const flushP=()=>{ if(para.length){ h+=`<p>${linkify(para.join(" "))}</p>`; para=[]; } };
  const flushL=()=>{ if(list){ h+=`</${list}>`; list=null; } };
  const flushQ=()=>{ if(quote.length){ h+=`<blockquote>${quote.map(q=>`<p>${linkify(q)}</p>`).join("")}</blockquote>`; quote=[]; } };
  const flushT=()=>{ if(table){ h+="<table>"+table.map((r,i)=>"<tr>"+r.map(c=>`<${i?"td":"th"}>${linkify(c)}</${i?"td":"th"}>`).join("")+"</tr>").join("")+"</table>"; table=null; } };
  for(const raw of lines){
    const l=raw.trimEnd();
    if(/^\s*\|.*\|\s*$/.test(l)){ flushP(); flushL(); flushQ(); const cells=l.trim().slice(1,-1).split("|").map(c=>c.trim()); if(cells.every(c=>/^:?-{2,}:?$/.test(c))) continue; (table=table||[]).push(cells); continue; }
    flushT();
    if(/^<!--.*-->$/.test(l.trim())) continue;
    let m;
    if((m=l.match(/^>\s?(.*)$/))){ flushP(); flushL(); if(m[1].trim()) quote.push(m[1]); continue; }
    flushQ();
    if(!l.trim()){ flushP(); flushL(); continue; }
    if((m=l.match(/^(#{1,4})\s+(.*)$/))){ flushP(); flushL(); h+=`<h${m[1].length}>${linkify(m[2])}</h${m[1].length}>`; continue; }
    if((m=l.match(/^\s*[-*•]\s+(.*)$/))){ flushP(); if(list!=="ul"){ flushL(); list="ul"; h+="<ul>"; } h+=`<li>${linkify(m[1])}</li>`; continue; }
    if((m=l.match(/^\s*\d+[.)]\s+(.*)$/))){ flushP(); if(list!=="ol"){ flushL(); list="ol"; h+="<ol>"; } h+=`<li>${linkify(m[1])}</li>`; continue; }
    flushL(); para.push(l.trim());
  }
  flushP(); flushL(); flushQ(); flushT();
  return h;
}

function snippet(txt,q){
  const i=txt.toLowerCase().indexOf(q.toLowerCase());
  if(i<0) return esc(txt.slice(0,70));
  const a=Math.max(0,i-26), b=Math.min(txt.length,i+q.length+44);
  return (a>0?"… ":"")+esc(txt.slice(a,i))+"<mark>"+esc(txt.slice(i,i+q.length))+"</mark>"+esc(txt.slice(i+q.length,b))+(b<txt.length?" …":"");
}
function renderDocs(){
  const q=$("#docSearch").value.trim(), box=$("#docScroll");
  if(!S.docs.length){ box.innerHTML=`<div class="hint">조사팩을 열면 조서·고소장·서약서가 여기 쌓입니다. 다음 조사에는 새로 생긴 것만 더해집니다.</div>`; return; }
  let html="";
  if(q.length>=2){
    const hits=[];
    for(const d of S.docs){ for(let i=0;i<(d.text||[]).length;i++){ const t=d.text[i]; if(t&&t.toLowerCase().includes(q.toLowerCase())){ hits.push({uid:d.uid,name:d.name,page:i+1,s:snippet(t,q)}); if(hits.length>=60) break; } } if(hits.length>=60) break; }
    html+=`<div class="grouphd">본문 · ${hits.length}${hits.length>=60?"+":""}면</div>`;
    html+=hits.length?hits.map(h=>`<button class="hit" data-uid="${esc(h.uid)}" data-p="${h.page}"><span class="h"><span class="pg">${h.page}면</span><span class="dn">${esc(h.name)}</span></span><span class="s">${h.s}</span></button>`).join("")
      :`<div class="hint">본문에서 찾지 못했습니다 (스캔 문서는 글자가 없습니다 — 목차로 찾으세요).</div>`;
  }
  const order={"수사기관":0,"고소인":1,"피의자":2,"기타":3};
  const docs=[...S.docs].sort((a,b)=>(order[a.side]??3)-(order[b.side]??3)||((a.date||"")<(b.date||"")?-1:1));
  const nq=q.toLowerCase();
  docs.forEach(d=>{
    const toc=(d.toc||[]).filter(t=>!q||String(t.title||"").toLowerCase().includes(nq));
    if(q&&!d.name.toLowerCase().includes(nq)&&!toc.length) return;
    html+=`<button class="docitem ${sideCls(d.side)}" data-uid="${esc(d.uid)}" ${S.doc&&S.doc.uid===d.uid?'aria-current="true"':""}>
      <div class="t">${esc(d.name)}</div><div class="m"><span>${esc(d.side||"")}</span>${d.date?`<span>${esc(kdate(d.date))}</span>`:""}<span>${d.pages}면</span>${d.key?`<span>${esc(d.key)}</span>`:""}</div></button>`;
    if(toc.length) html+=`<div class="toclist">`+toc.map(t=>`<button class="tocrow ${t.sub?"sub":""}" data-uid="${esc(d.uid)}" data-p="${t.p}"><span class="tp">${t.p}</span><span class="tt">${esc(t.title)}</span></button>`).join("")+`</div>`;
  });
  box.innerHTML=html||`<div class="hint">찾는 것이 없습니다.</div>`;
  box.querySelectorAll(".docitem").forEach(b=>b.onclick=()=>openDoc(b.dataset.uid,1));
  box.querySelectorAll(".hit,.tocrow").forEach(b=>b.onclick=()=>openDoc(b.dataset.uid,+b.dataset.p));
  markHere();
}
function markHere(){
  const rows=[...document.querySelectorAll(".tocrow")]; let best=null;
  rows.forEach(b=>{ b.classList.remove("here"); if(S.doc&&b.dataset.uid===S.doc.uid&&+b.dataset.p<=S.page&&(!best||+b.dataset.p>=+best.dataset.p)) best=b; });
  if(best) best.classList.add("here");
}

$("#docSearch").oninput=()=>{ clearTimeout(_sTimer); _sTimer=setTimeout(renderDocs,180); };

async function openDoc(uid,page){
  const d=S.docs.find(x=>x.uid===uid);
  if(!d){ toast("이 기록이 목록에 없습니다 · 조사팩을 다시 넣어 주세요",4000); return false; }
  S.doc=d; S.pages=d.pages;
  $("#vName").textContent=d.name; $("#pgOf").textContent="/ "+d.pages;
  $("#recList").classList.remove("open");
  goTab("rec");
  try{ renderDocs(); }catch(err){ console.error(err); }
  try{ await showPage(Math.min(Math.max(1,page||1),d.pages)); }
  catch(err){ console.error(err); vFail("면을 열지 못했습니다 — "+(err&&err.message||err)); return false; }
  return true;
}
function ab2b64(buf){ const b=new Uint8Array(buf), CH=0x8000; let s=""; for(let i=0;i<b.length;i+=CH) s+=String.fromCharCode.apply(null,b.subarray(i,i+CH)); return btoa(s); }
async function toDataURL(v){
  let buf=null;
  if(v instanceof ArrayBuffer) buf=v; else if(ArrayBuffer.isView(v)) buf=v.buffer; else if(v&&typeof v.arrayBuffer==="function") buf=await v.arrayBuffer();
  else throw new Error("알 수 없는 형식");
  if(!buf||!buf.byteLength) throw new Error("내용이 비어 있음");
  return "data:image/jpeg;base64,"+ab2b64(buf);
}
function vFail(msg){ const img=$("#pageImg"); $("#sheet").hidden=true; img.removeAttribute("src"); const e=$("#vEmpty"); e.hidden=false; e.textContent=msg; }
async function showPage(n){
  if(!S.doc) return;
  S.page=Math.min(Math.max(1,n),S.pages); $("#pgNow").value=S.page;
  const key=S.doc.uid+"#"+S.page; let url=null;
  if(S.pre&&S.pre.key===key){ url=S.pre.url; S.pre=null; }
  else{
    let blob=null;
    try{ blob=await get("blobs",key); }catch(err){ vFail("저장소를 읽지 못했습니다: "+(err.message||err)); return; }
    if(!blob){ vFail(`${S.page}면 이미지가 저장소에 없습니다. 조사팩을 다시 넣어 보세요.`); return; }
    try{ url=await toDataURL(blob); }catch(err){ vFail("이미지를 펴지 못했습니다 — "+(err.message||err)); return; }
  }
  S.url=url;
  const img=$("#pageImg"), sheet=$("#sheet");
  img.onerror=()=>vFail(`${S.page}면을 그리지 못했습니다. 조사팩을 다시 구워 주세요.`);
  img.onload=()=>{ $("#vEmpty").hidden=true; sheet.hidden=false; hlResize(); };
  img.src=url; sheet.hidden=false; applyZoom();
  $("#vEmpty").hidden=true; $("#imgWrap").scrollTop=0;
  $("#atPage").innerHTML=`<span>${esc(S.doc.name)} · ${S.page}면 열려 있음</span>`;
  markHere(); hlLoad(); preload(S.page+1);
}
async function preload(n){ if(!S.doc||n>S.pages) return; const key=S.doc.uid+"#"+n; if(S.pre&&S.pre.key===key) return; S.pre=null;
  try{ const b=await get("blobs",key); if(b) S.pre={key,url:await toDataURL(b)}; }catch(e){} }
(function(){
  const wrap=$("#imgWrap"); let g=null, last=0, lastTap=0;
  wrap.addEventListener("touchstart",e=>{ if(e.touches.length!==1||e.touches[0].touchType==="stylus"){ g=null; return; }
    const t=e.touches[0]; g={id:t.identifier,x:t.clientX,y:t.clientY,at:Date.now(),sl:wrap.scrollLeft,st:wrap.scrollTop}; },{passive:true});
  wrap.addEventListener("touchmove",e=>{ if(e.touches.length>1) g=null; },{passive:true});
  wrap.addEventListener("touchcancel",()=>{ g=null; },{passive:true});
  wrap.addEventListener("touchend",e=>{
    if(!g||!S.doc) return;
    const t=[...e.changedTouches].find(c=>c.identifier===g.id); if(!t) return;
    const s0=g; g=null; if(e.touches.length) return;
    const dx=t.clientX-s0.x, dy=t.clientY-s0.y, dt=Date.now()-s0.at;
    if(Math.abs(dx)<12&&Math.abs(dy)<12&&dt<300){ const now=Date.now(); if(now-lastTap<320){ lastTap=0; S.zoomIdx=S.zoomIdx===0?1:0; applyZoom(); return; } lastTap=now; return; }
    const flick=dt<250&&Math.abs(dx)>=40;
    if(dt>700||(Math.abs(dx)<64&&!flick)||Math.abs(dx)<Math.abs(dy)*1.6) return;
    if(Math.abs(wrap.scrollTop-s0.st)>10) return;
    if(wrap.scrollWidth>wrap.clientWidth+2){ if(Math.abs(wrap.scrollLeft-s0.sl)>4) return;
      const atLeft=wrap.scrollLeft<=1, atRight=wrap.scrollLeft+wrap.clientWidth>=wrap.scrollWidth-1; if((dx<0&&!atRight)||(dx>0&&!atLeft)) return; }
    const now=Date.now(); if(now-last<700) return; last=now;
    showPage(S.page+(dx<0?1:-1));
  },{passive:true});
})();
$("#pgPrev").onclick=()=>showPage(S.page-1);
$("#pgNext").onclick=()=>showPage(S.page+1);
$("#pgNow").onchange=e=>showPage(parseInt(e.target.value,10)||1);
function applyZoom(){
  const sheet=$("#sheet"), wrap=$("#imgWrap"), z=ZOOMS[S.zoomIdx];
  if(z==="fit"){ const d=S.doc, ratio=(d&&d.w&&d.h)?d.w/d.h:(1/1.4142); const availW=wrap.clientWidth-32, availH=wrap.clientHeight-32;
    sheet.style.width=Math.max(160,Math.min(availW,Math.floor(availH*ratio)))+"px"; }
  else sheet.style.width=z+"%";
  $("#zoomLbl").textContent=z==="fit"?"전체":(z===100?"폭":z+"%");
}
$("#zoomIn").onclick=()=>{ S.zoomIdx=Math.min(ZOOMS.length-1,S.zoomIdx+1); applyZoom(); };
$("#zoomOut").onclick=()=>{ S.zoomIdx=Math.max(0,S.zoomIdx-1); applyZoom(); };
$("#zoomLbl").onclick=()=>{ S.zoomIdx=S.zoomIdx===0?1:0; applyZoom(); };
window.addEventListener("resize",()=>{ if(S.doc&&ZOOMS[S.zoomIdx]==="fit") applyZoom(); });

/* ══ 펜 · 형광펜 · 지우개 (기일노트와 같다) ═══════════════════════ */
const HL={tool:null, strokes:[], cur:null, erasing:false, hist:[], style:{hl:{c:"rgba(255,222,0,.42)",w:16}, pen:{c:"#C8362B",w:2.6}}};
const hlKey=()=>S.doc?("hl:"+S.doc.uid+"#"+S.page):null;
async function hlLoad(){ const k=hlKey(); HL.cur=null; HL.erasing=false; HL.hist=[]; try{ HL.strokes=(k&&await get("hl",k))||[]; }catch(e){ HL.strokes=[]; } hlDraw(); }
async function hlSave(){ const k=hlKey(); if(k) await put("hl",k,HL.strokes); }
function hlSnap(){ HL.hist.push(JSON.stringify(HL.strokes)); if(HL.hist.length>40) HL.hist.shift(); }
function hlResize(){ const img=$("#pageImg"), cv=$("#hlCanvas"); const w=img.clientWidth, h=img.clientHeight; if(!w||!h) return;
  const dpr=Math.min(2,window.devicePixelRatio||1); cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); cv.style.width=w+"px"; cv.style.height=h+"px"; hlDraw(); }
function drawStroke(ctx,st,W,H){
  const pts=st.pts; if(!pts||!pts.length) return; const type=st.t||"hl", base=st.w*W/1000;
  ctx.globalCompositeOperation=type==="hl"?"multiply":"source-over"; ctx.strokeStyle=st.c; ctx.lineCap="round"; ctx.lineJoin="round";
  if(pts.length===1){ ctx.lineWidth=base; ctx.beginPath(); ctx.moveTo(pts[0][0]*W,pts[0][1]*H); ctx.lineTo(pts[0][0]*W+.5,pts[0][1]*H); ctx.stroke(); return; }
  if(type==="hl"){ ctx.lineWidth=base; ctx.beginPath(); pts.forEach((p,i)=>{ const x=p[0]*W,y=p[1]*H; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.stroke(); return; }
  for(let i=1;i<pts.length;i++){ const a=pts[i-1], b=pts[i], pr=((a[2]==null?.5:a[2])+(b[2]==null?.5:b[2]))/2; ctx.lineWidth=base*(0.55+0.9*pr); ctx.beginPath(); ctx.moveTo(a[0]*W,a[1]*H); ctx.lineTo(b[0]*W,b[1]*H); ctx.stroke(); }
}
function hlDraw(){ const cv=$("#hlCanvas"); if(!cv.width) return; const ctx=cv.getContext("2d"); ctx.clearRect(0,0,cv.width,cv.height);
  [...HL.strokes,HL.cur].filter(Boolean).forEach(st=>drawStroke(ctx,st,cv.width,cv.height)); ctx.globalCompositeOperation="source-over"; }
function segDist(px,py,ax,ay,bx,by){ const dx=bx-ax, dy=by-ay, L=dx*dx+dy*dy; const t=L?Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/L)):0; return Math.hypot(px-(ax+t*dx), py-(ay+t*dy)); }
function eraseAt(nx,ny,cv){ const W=cv.width, H=cv.height, x=nx*W, y=ny*H; const R=12*(W/(cv.clientWidth||W)); const before=HL.strokes.length;
  HL.strokes=HL.strokes.filter(st=>{ const half=(st.w*W/1000)/2+R, pts=st.pts; if(pts.length===1) return Math.hypot(pts[0][0]*W-x,pts[0][1]*H-y)>half;
    for(let i=1;i<pts.length;i++) if(segDist(x,y,pts[i-1][0]*W,pts[i-1][1]*H,pts[i][0]*W,pts[i][1]*H)<=half) return false; return true; });
  return HL.strokes.length!==before; }
(function(){
  const cv=$("#hlCanvas"); const cl=v=>Math.min(1,Math.max(0,v));
  const norm=e=>{ const r=cv.getBoundingClientRect(); return [cl((e.clientX-r.left)/r.width), cl((e.clientY-r.top)/r.height), e.pressure||.5]; };
  cv.addEventListener("pointerdown",e=>{ if(!HL.tool||e.pointerType!=="pen"||!S.doc) return; e.preventDefault(); try{ cv.setPointerCapture(e.pointerId); }catch(x){}
    hlSnap(); if(HL.tool==="erase"){ HL.erasing=true; const n=norm(e); if(eraseAt(n[0],n[1],cv)) hlDraw(); return; }
    const st=HL.style[HL.tool]; HL.cur={t:HL.tool,c:st.c,w:st.w,pts:[norm(e)]}; hlDraw(); });
  cv.addEventListener("pointermove",e=>{ if(e.pointerType!=="pen") return; if(HL.erasing){ e.preventDefault(); const n=norm(e); if(eraseAt(n[0],n[1],cv)) hlDraw(); return; }
    if(!HL.cur) return; e.preventDefault(); HL.cur.pts.push(norm(e)); hlDraw(); });
  const done=async e=>{ if(HL.erasing){ HL.erasing=false; if(HL.hist.length&&HL.hist[HL.hist.length-1]===JSON.stringify(HL.strokes)) HL.hist.pop(); else await hlSave(); return; }
    if(!HL.cur) return; const st=HL.cur; HL.cur=null; if(st.pts.length>1||st.t==="pen") HL.strokes.push(st); else HL.hist.pop(); hlDraw(); await hlSave(); };
  cv.addEventListener("pointerup",done); cv.addEventListener("pointercancel",done);
  const stopStylus=e=>{ if(!HL.tool) return; for(const t of e.changedTouches) if(t.touchType==="stylus"){ e.preventDefault(); return; } };
  cv.addEventListener("touchstart",stopStylus,{passive:false}); cv.addEventListener("touchmove",stopStylus,{passive:false});
  const wrapEl=$("#imgWrap"); wrapEl.addEventListener("selectstart",e=>e.preventDefault()); wrapEl.addEventListener("contextmenu",e=>{ if(HL.tool) e.preventDefault(); });
  $("#pageImg").draggable=false;
  cv.addEventListener("pointerleave",e=>{ if((HL.cur||HL.erasing)&&e.pointerType==="pen") done(e); });
  if(window.ResizeObserver) new ResizeObserver(()=>hlResize()).observe($("#pageImg"));
})();
function setTool(t){

async function noteAct(id,act){

  if(act==="req"){ n.req=!n.req; await put("notes",S.caseId,S.notes); renderNotes(); renderFollow(); counts(); toast(n.req?"요구항목으로 표시했습니다":"표시를 지웠습니다"); return; }

}
function promoteTodo(n){
  const ex=cur().exam||{}; let due=""; if(ex.date){ const d=new Date(ex.date+"T00:00:00"); d.setDate(d.getDate()+14); due=d.toISOString().slice(0,10); }
  modal({ title:"후속 할 일로", sub:"조사 뒤에 할 일",
    body:`<div class="field"><label>할 일</label><textarea id="fTx">${esc(n.tx)}</textarea></div><div class="field"><label>기한</label><input type="date" id="fDue" value="${esc(due)}"></div>`,
    ok:"올리기",
    async onOk(){ const tx=$("#fTx").value.trim(); if(!tx){ toast("내용이 비었습니다"); return false; }
      S.todos.push({id:uid(),tx,due:$("#fDue").value||null,done:false,src:n.id}); n.todo=true;
      await put("todos",S.caseId,S.todos); await put("notes",S.caseId,S.notes); renderNotes(); renderFollow(); counts(); toast("후속에 올렸습니다"); } });
}

function renderReview(){
  const box=$("#reviewWrap"), ck=(cur().checks||{}).열람||[], fixes=S.notes.filter(n=>n.fix);
  let h=`<div class="oneline" style="font-size:15px">조서를 읽을 때는 <b>사실과 다른 곳</b>과 <b>남기면 안 되는 표현</b>만 본다. 고칠 곳은 「이 부분은 ○○로 고쳐 주십시오」로 말하고, 고쳐진 것을 화면에서 확인한 뒤 서명한다.</div>`;
  h+=checklistHtml("조서 열람 때 확인",ck,"확인");
  const done=fixes.filter(n=>(S.checks["fix:"+n.id]||{}).done).length;
  h+=`<div class="sectionhd"><h2>정정 요청</h2><span class="c">${done}/${fixes.length} 반영</span><button class="btn sm" id="fixAdd" style="margin-left:auto">＋ 정정 요청</button></div>`;
  h+=fixes.length?`<div class="card">`+fixes.map(n=>{ const d=(S.checks["fix:"+n.id]||{}).done; return `<div class="ck ${d?"done":""}"><button class="chk" role="checkbox" aria-checked="${!!d}" data-ck="fix:${esc(n.id)}" aria-label="반영">✓</button>
      <div class="body"><div class="t">${linkify(n.tx)}</div><div class="n">${hhmm(n.t)} · ${esc(n.who)}</div></div></div>`; }).join("")+`</div>`
    :`<div class="card"><div class="hint">노트에서 줄 옆 <b>⚑</b>를 누르면 여기 쌓입니다. 조사 중에 「이 말은 조서에 이렇게 남으면 안 된다」 싶은 순간 바로 표시해 두세요.</div></div>`;
  box.innerHTML=h; bindChecks(box); bindRefs(box);
  $("#fixAdd").onclick=()=>modal({ title:"정정 요청", sub:"조서 열람 때 고쳐 달라고 할 문장",
    body:`<div class="field"><label>고칠 내용</label><textarea id="fX" placeholder="예: 「추측」을 「자료에 비추어 판단」으로"></textarea></div>`, ok:"올리기",
    async onOk(){ const x=$("#fX").value.trim(); if(!x){ toast("내용이 비었습니다"); return false; }
      S.notes.push({id:uid(),t:Date.now(),who:"변호사",tx:x,fix:true}); await put("notes",S.caseId,S.notes); renderNotes(); renderReview(); counts(); } });
}

/* ══ 후속 ═════════════════════════════════════════════════════════ */
function renderFollow(){
  const box=$("#followWrap"), ck=(cur().checks||{}).후속||[], reqs=S.notes.filter(n=>n.req);
  let h="";
  h+=`<div class="sectionhd"><h2>검사 요구항목으로 들은 것</h2><span class="c">${reqs.length}</span></div>`;
  h+=reqs.length?`<div class="card">`+reqs.map(n=>`<div class="ck"><span class="mark r" style="margin:3px 0 0">✎</span><div class="body"><div class="t">${linkify(n.tx)}</div><div class="n">${hhmm(n.t)} · ${esc(n.who)}</div></div></div>`).join("")+`</div>`
    :`<div class="card"><div class="hint">수사관이 읽어 주는 보완수사 요구사항을 노트에 적고 <b>✎</b>를 누르면 여기 모입니다. 조사 뒤 의견서의 목차가 됩니다.</div></div>`;
  const rows=[...ck.map(i=>({id:i.id,tx:i.tx,due:i.due,note:i.note,done:(S.checks[i.id]||{}).done,fixed:true})),
              ...S.todos.map(t=>({id:t.id,tx:t.tx,due:t.due,done:t.done,fixed:false}))];
  const open=rows.filter(r=>!r.done), done=rows.filter(r=>r.done);
  const row=r=>{ const d=daysTo(r.due); const cls=d==null?"":d<0?"over":d<=3?"soon":"";
    const lbl=r.due?(d<0?`${kdate(r.due)} · ${-d}일 지남`:d===0?`${kdate(r.due)} · 오늘`:`${kdate(r.due)} · D-${d}`):"기한 없음";
    return `<div class="ck ${r.done?"done":""}"><button class="chk" role="checkbox" aria-checked="${!!r.done}" data-todo="${esc(r.id)}" data-fixed="${r.fixed?1:0}" aria-label="완료">✓</button>
      <div class="body"><div class="t">${linkify(r.tx)}</div>${r.note?`<div class="n">${linkify(r.note)}</div>`:""}<div class="m"><span class="due ${cls}">${esc(lbl)}</span></div></div>
      ${r.fixed?"":`<button class="btn ghost sm" data-del="${esc(r.id)}">×</button>`}</div>`; };
  h+=`<div class="sectionhd"><h2>조사 뒤에 할 일</h2><span class="c">남은 ${open.length}건</span><button class="btn sm" id="todoAdd" style="margin-left:auto">＋ 할 일</button></div>`;
  h+=`<div class="card">${open.map(row).join("")||'<div class="hint">남은 일이 없습니다.</div>'}</div>`;
  if(done.length) h+=`<div class="sectionhd" style="margin-top:4px"><h2 style="font-size:15px;color:var(--mute)">끝낸 것</h2><span class="c">${done.length}</span></div><div class="card">${done.map(row).join("")}</div>`;
  box.innerHTML=h; bindRefs(box);
  box.querySelectorAll("[data-todo]").forEach(b=>b.onclick=async()=>{
    const id=b.dataset.todo;
    if(b.dataset.fixed==="1"){ const v=S.checks[id]||{}; v.done=!v.done; v.t=Date.now(); S.checks[id]=v; await put("checks",S.caseId,S.checks); }
    else{ const t=S.todos.find(x=>x.id===id); if(t){ t.done=!t.done; await put("todos",S.caseId,S.todos); } }
    renderFollow(); counts(); });
  box.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{ S.todos=S.todos.filter(x=>x.id!==b.dataset.del); await put("todos",S.caseId,S.todos); renderFollow(); counts(); });
  $("#todoAdd").onclick=()=>{ const ex=cur().exam||{}; let due=""; if(ex.date){ const d=new Date(ex.date+"T00:00:00"); d.setDate(d.getDate()+14); due=d.toISOString().slice(0,10); }
    modal({ title:"할 일", sub:"조사 뒤에", body:`<div class="field"><label>할 일</label><textarea id="fTx"></textarea></div><div class="field"><label>기한</label><input type="date" id="fDue" value="${esc(due)}"></div>`, ok:"만들기",
      async onOk(){ const tx=$("#fTx").value.trim(); if(!tx){ toast("내용이 비었습니다"); return false; } S.todos.push({id:uid(),tx,due:$("#fDue").value||null,done:false}); await put("todos",S.caseId,S.todos); renderFollow(); counts(); } }); };
}

/* ══ 내보내기 ═════════════════════════════════════════════════════ */
let downloads=window.__stdDownloads||null;
if(window.claude&&claude.use) claude.use("downloads").then(d=>{downloads=d;}).catch(()=>{});
$("#exportBtn").onclick=async()=>{
  const c=cur(); const stamp=(c.exam||{}).date||today();
  const base=`${(c.name||"사건").replace(/[\\/:*?"<>|]/g,"")}_${stamp.replace(/-/g,"")}`;
  let hl={}; try{ hl=await hlSummary(); }catch(e){}
  const md=noteMarkdown(c,hl);
  if(!downloads){
    modal({ title:"내려받기를 쓸 수 없습니다", sub:"이 화면에서는 파일 저장이 막혀 있습니다. 아래 글을 길게 눌러 복사하세요.",
      body:`<div class="field"><label>조사노트</label><textarea style="min-height:220px;font-family:var(--mono);font-size:12px">${esc(md)}</textarea></div>`, ok:"닫기", async onOk(){} });
    return;
  }
  try{ await downloads.save({filename:base+"_조사노트.md",data:md}); toast("내려받았습니다 — 파일 앱에서 드라이브로 옮기면 PC로 갑니다",4200); }
  catch(e){ if(e&&e.code!=="declined") toast("내려받기 실패: "+(e.message||e.code||e),4000); }
};
function noteMarkdown(c,hl){
  const L=[], ex=c.exam||{}, qa=c.qa||[], ck=c.checks||{};
  const cell=s=>String(s==null?"":s).replace(/\|/g,"\\|").replace(/\n/g," ");
  L.push(`# ${c.name||""}  조사노트`); L.push("");
  L.push(`- ${c.caseNo||"-"}${c.agency?"  ·  "+c.agency:""}`);
  L.push(`- 조사 ${kdate(ex.date)} ${ex.time||""} ${ex.place||""} · ${ex.officer||""}`.replace(/\s+/g," ").trim());
  L.push(`- 진술인 ${ex.who||""} · ${ex.me||""}`); L.push("");
  if(qa.length){
    L.push("## 문답 결과"); L.push(""); L.push("| # | 질문 | 물었음 | 실제 답 | 비고 |"); L.push("|---|---|---|---|---|");
    qa.forEach((q,i)=>{ const st=S.qa[q.id]||{}; L.push(`| ${i+1} | ${cell(q.q)} | ${st.asked?"○"+(st.t?" "+hhmm(st.t):""):"—"} | ${cell(st.actual||"")} | ${st.dev?"준비와 다르게 답함":""} |`); });
    L.push("");
  }
  const reqs=S.notes.filter(n=>n.req);
  if(reqs.length){ L.push("## 검사 요구항목으로 들은 것"); L.push(""); reqs.forEach((n,i)=>L.push(`${i+1}. ${n.tx}  (${hhmm(n.t)} ${n.who})`)); L.push(""); }
  L.push("## 진행"); L.push(""); L.push("| 시각 | 발언 | 내용 |"); L.push("|---|---|---|");
  S.notes.forEach(n=>L.push(`| ${hhmm(n.t)} | ${n.who} | ${cell(n.tx)}${n.fix?" ⚑정정":""}${n.req?" ✎요구":""}${n.todo?" ☑후속":""} |`));
  L.push("");
  const fixes=S.notes.filter(n=>n.fix);
  if(fixes.length){ L.push("## 조서 정정 요청"); L.push(""); fixes.forEach(n=>L.push(`- [${(S.checks["fix:"+n.id]||{}).done?"x":" "}] ${n.tx}`)); L.push(""); }
  const secs=[["자료","가져간 자료"],["요청","수사관에게 요청"],["열람","조서 열람 확인"]];
  secs.forEach(([k,t])=>{ const items=ck[k]||[]; if(!items.length) return; L.push("## "+t); L.push(""); items.forEach(i=>L.push(`- [${(S.checks[i.id]||{}).done?"x":" "}] ${i.tx}`)); L.push(""); });
  const follow=[...(ck.후속||[]).map(i=>({tx:i.tx,due:i.due,done:(S.checks[i.id]||{}).done})),...S.todos];
  if(follow.length){ L.push("## 조사 뒤에 할 일"); L.push(""); follow.forEach(t=>L.push(`- [${t.done?"x":" "}] ${t.tx}${t.due?`  —  ${kdate(t.due)}`:""}`)); L.push(""); }
  if(hl&&Object.keys(hl).length){ L.push("## 형광펜 표시한 면"); L.push(""); Object.keys(hl).forEach(n=>L.push(`- ${n}: ${hl[n].join(", ")}면`)); L.push(""); }
  if(S.docs.length){ L.push("## 가져간 기록"); L.push(""); S.docs.forEach(d=>L.push(`- ${d.name} (${d.pages}면)`)); }
  return L.join("\n");
}

/* ══ 모달 ═════════════════════════════════════════════════════════ */
let _mOk=null;
function modal({title,sub,body,ok,danger,onOk,onOpen}){
  $("#mTitle").textContent=title; $("#mSub").textContent=sub||""; $("#mSub").hidden=!sub; $("#mBody").innerHTML=body||"";
  $("#mFoot").innerHTML=`<button class="btn" id="mCancel">취소</button><button class="btn ${danger?"seal":"primary"}" id="mOk">${esc(ok||"확인")}</button>`;
  $("#scrim").classList.add("on"); $("#mCancel").onclick=closeModal; _mOk=onOk;
  $("#mOk").onclick=async()=>{ const r=_mOk?await _mOk():undefined; if(r!==false) closeModal(); };
  if(onOpen) onOpen();
  const f=$("#mBody").querySelector("input,textarea,select"); if(f) setTimeout(()=>f.focus(),40);
}
function closeModal(){ $("#scrim").classList.remove("on"); _mOk=null; }
$("#scrim").onclick=e=>{ if(e.target===$("#scrim")) closeModal(); };
document.addEventListener("keydown",e=>{
  if(e.key==="Escape") closeModal();
  if(!S.doc) return;
  const tag=(document.activeElement||{}).tagName; if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT") return;
  if(!$("#pane-rec").classList.contains("on")) return;
  if(e.key==="ArrowLeft") showPage(S.page-1); if(e.key==="ArrowRight") showPage(S.page+1);
});

/* ══ 탭 · 집계 ════════════════════════════════════════════════════ */
$$(".tab").forEach(t=>t.onclick=()=>{
  $$(".tab").forEach(x=>x.setAttribute("aria-selected",String(x===t)));
  $$(".pane").forEach(p=>p.classList.toggle("on",p.id==="pane-"+t.dataset.t));
  if(t.dataset.t==="note") setTimeout(()=>{ const b=$("#noteScroll"); b.scrollTop=b.scrollHeight; },30);
  if(t.dataset.t==="rec"&&S.doc&&ZOOMS[S.zoomIdx]==="fit") setTimeout(applyZoom,30);
});
function counts(){
  const c=cur(), qa=c.qa||[], ck=c.checks||{};
  $("#nQa").textContent=`${qa.filter(q=>(S.qa[q.id]||{}).asked).length}/${qa.length}`;
  $("#nRec").textContent=S.docs.reduce((s,d)=>s+(d.pages||0),0);
  $("#nNote").textContent=S.notes.length;
  $("#nFix").textContent=S.notes.filter(n=>n.fix&&!(S.checks["fix:"+n.id]||{}).done).length;
  $("#nFollow").textContent=(ck.후속||[]).filter(i=>!(S.checks[i.id]||{}).done).length+S.todos.filter(t=>!t.done).length;
}
function renderAll(){ renderGlance(); renderBrief(); renderQA(); renderDocs(); renderNotes(); renderReview(); renderFollow(); counts(); }

loadCases().catch(err=>{ console.error(err);
  document.querySelector(".main").innerHTML=`<div class="empty"><h2>저장소를 열 수 없습니다</h2><p>사파리 개인정보 보호 모드에서는 기록을 저장할 수 없습니다. 일반 창에서 열어 주세요.</p></div>`; });
</script>
