<script>
(function(){
  function blobOf(filename,data){
    if(data instanceof Blob) return data;
    if(data instanceof ArrayBuffer||ArrayBuffer.isView(data)) return new Blob([data]);
    var ext=(String(filename).split(".").pop()||"").toLowerCase();
    var mt={md:"text/markdown",ics:"text/calendar",txt:"text/plain",json:"application/json",csv:"text/csv",html:"text/html"}[ext]||"application/octet-stream";
    return new Blob([String(data)],{type:mt+";charset=utf-8"});
  }
  function viaAnchor(blob,filename){
    var u=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=u; a.download=filename; a.rel="noopener"; a.style.display="none";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ a.remove(); URL.revokeObjectURL(u); },60000);
  }
  window.__stdDownloads={
    save:function(o){
      var filename=o.filename, blob=blobOf(filename,o.data);
      var touch=("ontouchstart" in window)||navigator.maxTouchPoints>0;
      var file=null; try{ file=new File([blob],filename,{type:blob.type||"application/octet-stream"}); }catch(e){}
      /* 아이패드: 공유 시트로 — 「파일에 저장」·드라이브 앱으로 바로 보낸다. 취소하면 declined */
      if(touch&&file&&navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
        return navigator.share({files:[file],title:filename}).then(function(){ return {ok:true}; })
          .catch(function(e){
            if(e&&e.name==="AbortError"){ var err=new Error("취소"); err.code="declined"; throw err; }
            viaAnchor(blob,filename); return {ok:true};
          });
      }
      viaAnchor(blob,filename); return Promise.resolve({ok:true});
    }
  };
  if("serviceWorker" in navigator){
    window.addEventListener("load",function(){
      navigator.serviceWorker.register("../sw.js").catch(function(e){ console.warn("serviceWorker",e); });
    });
  }
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">

<script src="../vendor/jszip.min.js"></script>

<style>
:root{
  --ink:#1F1B1D; --ink-2:#3A3236; --paper:#F3F0EE; --surface:#FFFFFF;
  --surface-2:#F8F5F3; --line:#DAD2D0; --line-2:#E8E2E0;
  --mute:#736A6E; --mute-2:#948A8F;
  --brand:#7A3B5C; --brand-soft:#F4E7EE;
  --seal:#B23B2E; --seal-soft:#FBEEEC;
  --pen:#2C4E7A; --pen-soft:#EAF0F7;
  --court:#4A3B6B; --court-soft:#F0ECF6;
  --ok:#2F6B4F; --ok-soft:#E9F3ED;
  --warn:#B85C00; --warn-soft:#FBEFE0;
  --rec:#C8362B;
  --shadow:0 1px 2px rgba(31,27,29,.06), 0 6px 18px rgba(31,27,29,.06);
  --shadow-lg:0 8px 40px rgba(31,27,29,.18);
  --r:10px;
  --serif:"Gowun Batang","Nanum Myeongjo",'Apple SD Gothic Neo',serif;
  --sans:"Noto Sans KR",'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#ECE6E9; --ink-2:#C3B8BD; --paper:#171315; --surface:#221C1F;
    --surface-2:#1C1719; --line:#3A3034; --line-2:#2E2629;
    --mute:#A0949A; --mute-2:#7A6F74;
    --brand:#D08BB0; --brand-soft:#2E1A25;
    --seal:#E0705F; --seal-soft:#2E1E1C;
    --pen:#7EA6D6; --pen-soft:#18242F;
    --court:#AC98D6; --court-soft:#221E2E;
    --ok:#6FC195; --ok-soft:#16241D;
    --warn:#E0A05A; --warn-soft:#2A2013;
    --rec:#F07364;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
    --shadow-lg:0 8px 40px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ink:#ECE6E9; --ink-2:#C3B8BD; --paper:#171315; --surface:#221C1F;
  --surface-2:#1C1719; --line:#3A3034; --line-2:#2E2629;
  --mute:#A0949A; --mute-2:#7A6F74;
  --brand:#D08BB0; --brand-soft:#2E1A25;
  --seal:#E0705F; --seal-soft:#2E1E1C;
  --pen:#7EA6D6; --pen-soft:#18242F;
  --court:#AC98D6; --court-soft:#221E2E;
  --ok:#6FC195; --ok-soft:#16241D;
  --warn:#E0A05A; --warn-soft:#2A2013;
  --rec:#F07364;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
  --shadow-lg:0 8px 40px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;
  -webkit-text-size-adjust:100%;overscroll-behavior:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.app{display:flex;flex-direction:column;height:100dvh;min-height:0}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:9px 16px;background:var(--surface);
  border-bottom:1px solid var(--line);padding-top:max(9px,env(safe-area-inset-top))}
.brand{display:flex;align-items:baseline;gap:9px}
.brand b{font-family:var(--serif);font-weight:700;font-size:19px;letter-spacing:-.01em;color:var(--brand)}
.brand span{font-size:10.5px;color:var(--mute-2);letter-spacing:.14em;text-transform:uppercase}
.caseline{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1;flex-wrap:wrap}
.caseline .nm{font-family:var(--serif);font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.caseno{font-family:var(--mono);font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.top .right{display:flex;align-items:center;gap:8px;margin-left:auto}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:100px;font-size:11.5px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.badge.meet{background:var(--brand-soft);color:var(--brand);border-color:color-mix(in srgb,var(--brand) 22%,transparent)}
.badge.demo{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 25%,transparent)}
.badge.rec{background:var(--rec);color:#fff;font-family:var(--mono);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.55}}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:8px;border:1px solid var(--line);background:var(--surface);
  font-size:13px;font-weight:500;min-height:36px;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.primary:hover{opacity:.92;background:var(--brand)}
.btn.seal{background:var(--seal);color:#fff;border-color:var(--seal)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:4px 9px;min-height:29px;font-size:12px}
.btn[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}

.tabs{display:flex;gap:2px;background:var(--surface);border-bottom:1px solid var(--line);padding:0 10px;overflow-x:auto}
.tab{padding:9px 13px 8px;font-size:13.5px;font-weight:500;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap;min-height:40px;display:flex;align-items:center;gap:7px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand);font-weight:600}
.tab .n{font-family:var(--mono);font-size:10.5px;padding:1px 5px;border-radius:100px;background:var(--surface-2);color:var(--mute);border:1px solid var(--line-2)}
.tab[aria-selected="true"] .n{background:var(--brand-soft);color:var(--brand);border-color:transparent}
.tab .dot{width:8px;height:8px;border-radius:50%;background:var(--rec);animation:blink 1.6s infinite}

.main{flex:1;min-height:0;display:flex;overflow:hidden}
.pane{display:none;flex:1;min-width:0;min-height:0}
.pane.on{display:flex}
.cols{flex:1;overflow-y:auto;padding:16px;min-height:0;-webkit-overflow-scrolling:touch}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sectionhd{display:flex;align-items:baseline;gap:10px;margin:6px 0 0}
.sectionhd h2{font-family:var(--serif);font-size:17px;font-weight:700;margin:0}
.sectionhd .c{font-family:var(--mono);font-size:12px;color:var(--mute)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card .bd{padding:6px 15px 13px}
.hint{font-size:12.5px;color:var(--mute-2);padding:18px 14px;line-height:1.6}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;padding:40px 24px;text-align:center;color:var(--mute)}
.empty h2{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--ink);margin:0}
.empty p{margin:0;font-size:14px;max-width:44ch;line-height:1.65}

/* 한눈에 */
.ov{margin:0 0 10px;line-height:1.6;font-size:15px}.ov .n{display:inline-block;min-width:22px;color:var(--brand)}
.meetgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.meetgrid .cell{padding:10px 14px;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}
.meetgrid .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute-2);font-weight:600}
.meetgrid .v{font-size:14px;margin-top:2px;line-height:1.45}
.oneline{background:var(--brand-soft);border:1px solid color-mix(in srgb,var(--brand) 25%,transparent);border-radius:var(--r);padding:16px 20px;font-family:var(--serif);font-size:17.5px;line-height:1.6;color:var(--ink);text-wrap:balance}
.oneline b{color:var(--brand)}
.point .q{font-family:var(--serif);font-size:15.5px;font-weight:700;line-height:1.5;padding:12px 15px 6px}
.point .row{display:grid;grid-template-columns:78px 1fr;gap:10px;padding:6px 15px;font-size:14px;line-height:1.55}
.point .row .k{font-size:11px;font-weight:600;color:var(--mute);letter-spacing:.06em;padding-top:3px}
.point .row.ans{background:var(--ok-soft);padding:10px 15px 12px}
.point .row.ans .k{color:var(--ok)}
.point .row.opt{background:var(--surface-2)}
.point+.point{border-top:1px solid var(--line-2)}
.point .dec{padding:8px 15px 12px;display:grid;grid-template-columns:78px 1fr;gap:10px;align-items:start}
.point .dec .k{font-size:11px;font-weight:600;color:var(--brand);letter-spacing:.06em;padding-top:9px}
.point .dec textarea{width:100%;min-height:44px;resize:vertical;padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:14px;line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;display:flex;flex-direction:column;gap:3px}
.stat .k{font-size:11px;letter-spacing:.08em;color:var(--mute);font-weight:600}
.stat .v{font-family:var(--mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.stat .s{font-size:12px;color:var(--mute);line-height:1.45}
.stat .w{font-size:12px;color:var(--warn);line-height:1.45;margin-top:3px;padding-top:4px;border-top:1px dashed color-mix(in srgb,var(--warn) 40%,transparent)}
.stat.warn{border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.spot{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;padding:9px 15px;border-top:1px solid var(--line-2);align-items:start}
.spot:first-child{border-top:none}
.spot .pg{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--pen);background:var(--pen-soft);padding:3px 8px;border-radius:6px;white-space:nowrap;min-height:28px;display:inline-flex;align-items:center}
.spot .pg:hover{background:var(--pen);color:#fff}
.spot .lb{font-weight:600;font-size:14px;line-height:1.45}
.spot .tx{grid-column:2;font-size:13px;color:var(--ink-2);line-height:1.5}
.chk{width:22px;height:22px;flex:0 0 22px;border:1.5px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent;margin-top:1px}
.chk[aria-checked="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.ck{display:flex;align-items:flex-start;gap:11px;padding:10px 15px;border-top:1px solid var(--line-2)}
.ck:first-child{border-top:none}
.ck .body{flex:1;min-width:0}
.ck .t{font-size:14px;line-height:1.5}
.ck.done .t{color:var(--mute-2);text-decoration:line-through}
.ck .n{font-size:12px;color:var(--mute);margin-top:2px}
.ck .m{display:flex;gap:9px;align-items:center;margin-top:5px;flex-wrap:wrap}
.ck textarea.memo{width:100%;margin-top:6px;min-height:38px;resize:vertical;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface-2);font-size:13.5px;line-height:1.5}
.due{font-family:var(--mono);font-size:11.5px;padding:2px 7px;border-radius:5px;background:var(--surface-2);color:var(--mute);border:1px solid var(--line-2)}
.due.soon{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.due.over{background:var(--seal-soft);color:var(--seal);border-color:transparent}
a.pref,button.pref{font-family:var(--mono);font-size:12.5px;color:var(--pen);text-decoration:none;border-bottom:1px dashed color-mix(in srgb,var(--pen) 45%,transparent);cursor:pointer;padding:0}
a.pref:hover,button.pref:hover{color:var(--seal);border-bottom-color:var(--seal)}
.related{display:flex;flex-wrap:wrap;gap:6px}
.related span{font-size:12px;padding:3px 9px;border-radius:100px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}

/* 보고서 */
.sum{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 24px;line-height:1.72;font-size:14.5px;max-width:80ch}
.sum h1{font-family:var(--serif);font-size:21px;margin:0 0 6px;line-height:1.35}
.sum h2{font-family:var(--serif);font-size:16.5px;margin:22px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line-2)}
.sum h3{font-family:var(--serif);font-size:16px;margin:20px 0 6px;color:var(--brand)}
.sum h4{font-size:14px;margin:12px 0 3px;color:var(--ink-2)}
.sum p{margin:6px 0}
.sum ul,.sum ol{margin:4px 0 8px;padding-left:22px}
.sum li{margin:3px 0}
.sum blockquote{margin:8px 0;padding:8px 14px;border-left:3px solid var(--brand);background:var(--brand-soft);border-radius:0 6px 6px 0}
.sum table{border-collapse:collapse;margin:8px 0;font-size:13.5px;display:block;overflow-x:auto}
.sum th,.sum td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
.sum th{background:var(--surface-2);font-weight:600}
.sum code{font-family:var(--mono);font-size:12.5px;background:var(--surface-2);padding:1px 5px;border-radius:4px}
.sum .meta{font-family:var(--mono);font-size:11px;color:var(--mute-2);margin-top:14px}
.sum hr{border:none;border-top:1px solid var(--line-2);margin:14px 0}

/* 질문 */
.qa{flex:1;display:flex;min-height:0;min-width:0}
.qlist{width:340px;flex:0 0 340px;border-right:1px solid var(--line);background:var(--surface);overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch}
.qitem{display:grid;grid-template-columns:14px 1fr;gap:10px;width:100%;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line-2);border-left:3px solid transparent;align-items:start}
.qitem:hover{background:var(--surface-2)}
.qitem[aria-current="true"]{background:var(--brand-soft);border-left-color:var(--brand)}
.qitem .dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line);margin-top:6px}
.qitem.asked .dot{background:var(--ok);border-color:var(--ok)}
.qitem.flag .dot{background:var(--warn);border-color:var(--warn)}
.qitem .t{font-size:13.5px;line-height:1.45}
.qitem .tag{font-size:10.5px;font-weight:600;letter-spacing:.06em;color:var(--mute);display:block;margin-bottom:2px}
.qdetail{flex:1;min-width:0;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.qcard{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.qcard .qh{display:flex;flex-direction:column;gap:8px}
.qcard .qh .tagline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tagchip{font-size:11px;font-weight:600;letter-spacing:.06em;padding:2px 8px;border-radius:100px;background:var(--surface-2);color:var(--mute);border:1px solid var(--line-2)}
.tagchip.결정{background:var(--brand-soft);color:var(--brand);border-color:transparent}
.tagchip.자료{background:var(--pen-soft);color:var(--pen);border-color:transparent}
.tagchip.사실{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.qcard h2{font-family:var(--serif);font-size:19px;font-weight:700;margin:0;line-height:1.45;text-wrap:balance}
.qacts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qsec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.qsec .h{font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--mute);padding:8px 15px 0}
.qsec .b{padding:6px 15px 13px;font-size:14.5px;line-height:1.7;white-space:pre-wrap}
.qsec.why .b{color:var(--ink-2);font-size:14px}
.qsec.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)} .qsec.warn .h{color:var(--warn)} .qsec.warn .b{color:var(--ink)}
.srcs{display:flex;flex-wrap:wrap;gap:6px;padding:6px 15px 13px}
.srcchip{font-family:var(--mono);font-size:12px;font-weight:500;padding:4px 9px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);min-height:30px;display:inline-flex;align-items:center;gap:6px}
.srcchip:hover{border-color:var(--pen);color:var(--pen)}
.srcchip i{font-style:normal;font-family:var(--sans);font-size:11.5px;color:var(--mute)}
.actual textarea{width:100%;resize:vertical;min-height:72px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-size:14.5px;line-height:1.5}
.qback{display:none}
@media (max-width:900px){
  .qlist{width:100%;flex:1 1 auto;border-right:none}
  .qa.detail .qlist{display:none}
  .qa:not(.detail) .qdetail{display:none}
  .qback{display:inline-flex}
}

/* 자료 */
.reclist{width:300px;flex:0 0 300px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.searchwrap{padding:9px 11px;border-bottom:1px solid var(--line-2)}
.searchwrap input{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface-2);font-size:13px;min-height:34px}
.searchwrap input::placeholder{color:var(--mute-2)}
.scroll{overflow-y:auto;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.grouphd{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute-2);font-weight:600;padding:13px 13px 5px}

<script>
"use strict";
/* ══ 저장소 ═══════════════════════════════════════════════════════ */
const DB_NAME="sangdamnote", DB_VER=1;
const STORES=["cases","blobs","notes","qa","checks","todos","hl","rec","recmeta"];
let _db=null;
function db(){
  if(_db) return Promise.resolve(_db);
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,DB_VER);
    r.onupgradeneeded=()=>{ const d=r.result;
      STORES.forEach(s=>{ if(!d.objectStoreNames.contains(s)) d.createObjectStore(s,{keyPath:"k"}); }); };
    r.onsuccess=()=>{ _db=r.result; res(_db); };
    r.onerror=()=>rej(r.error);
  });
}
async function put(store,k,v){ const d=await db();
  return new Promise((res,rej)=>{ const t=d.transaction(store,"readwrite"); t.objectStore(store).put({k,v}); t.oncomplete=res; t.onerror=()=>rej(t.error); }); }
async function putMany(store,rows){ const d=await db();
  return new Promise((res,rej)=>{ const t=d.transaction(store,"readwrite"), o=t.objectStore(store); rows.forEach(r=>o.put({k:r.k,v:r.v})); t.oncomplete=res; t.onerror=()=>rej(t.error); }); }
async function delMany(store,keys){ const d=await db();
  return new Promise((res,rej)=>{ const t=d.transaction(store,"readwrite"), o=t.objectStore(store); keys.forEach(k=>o.delete(k)); t.oncomplete=res; t.onerror=()=>rej(t.error); }); }
async function get(store,k){ const d=await db();
  return new Promise((res,rej)=>{ const r=d.transaction(store,"readonly").objectStore(store).get(k); r.onsuccess=()=>res(r.result?r.result.v:null); r.onerror=()=>rej(r.error); }); }
async function all(store){ const d=await db();
  return new Promise((res,rej)=>{ const r=d.transaction(store,"readonly").objectStore(store).getAll(); r.onsuccess=()=>res((r.result||[]).map(x=>({k:x.k,v:x.v}))); r.onerror=()=>rej(r.error); }); }

window.addEventListener("error",e=>{ try{ toast("오류: "+(e.message||e.error||"알 수 없음"),6000); }catch(x){} });
window.addEventListener("unhandledrejection",e=>{ try{ const r=e.reason; toast("오류: "+((r&&(r.message||r.name))||String(r)),6000); }catch(x){} });

/* ══ 상태 ═════════════════════════════════════════════════════════ */
const S={ caseId:null, cases:{}, docs:[], keys:{}, notes:[], qa:{}, checks:{}, todos:[], fold:{},
          who:"의뢰인", doc:null, page:1, pages:0, zoomIdx:1, url:null, pre:null, qid:null };
const ZOOMS=["fit",100,125,150,200,300];
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const SIDE_CLS={"의뢰인":"s-cl","상대방":"s-op","법원":"s-c","기타":"s-x"};
const sideCls=v=>SIDE_CLS[v]||"";
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const hhmm=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");};
const mmss=s=>{ s=Math.max(0,Math.round(s)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0"); };
const kdate=s=>{ if(!s) return ""; const[y,m,d]=String(s).split("-"); return d?`${y}. ${+m}. ${+d}.`:s; };

$("#openBtn").onclick=()=>$("#fileIn").click();
$("#fileIn").onchange=async e=>{

  catch(err){ console.error(err); toast("상담팩을 읽지 못했습니다: "+(err.message||err),4500); setProg(0); }

async function importPack(file){
  setProg(.03);
  const zip=await JSZip.loadAsync(file);
  const pj=zip.file("pack.json");
  if(!pj) throw new Error("pack.json이 없습니다. 상담팩 zip이 맞는지 확인하세요.");
  const pack=JSON.parse(await pj.async("string"));
  if(pack.app!=="상담노트") throw new Error("상담노트 팩이 아닙니다"+(pack.app?" ("+pack.app+")":pack.v?" (기일팩?)":"")+".");
  const cid=pack.case.id;
  const prev=(await get("cases",cid))||null;
  let docs=(prev&&prev.docs)?[...prev.docs]:[];
  const have=new Set(docs.map(d=>d.uid));
  const list=pack.docs||[];
  const totalPages=list.reduce((s,d)=>s+(d.pages||0),0)||1;
  let done=0, added=0; const replaced=[];
  for(const d of list){
    const u=cid+"/"+d.sha;
    if(have.has(u)){ done+=d.pages||0; continue; }
    for(const old of docs.filter(x=>x.uid!==u&&x.src&&d.src&&x.src===d.src)){ await supersede(old,u,d.pages||0); replaced.push(old.uid); }
    let batch=[];
    for(let p=1;p<=d.pages;p++){
      const f=zip.file(`${d.dir}/${pad4(p)}.jpg`);
      if(f) batch.push({k:u+"#"+p, v:await f.async("arraybuffer")});
      done++;
      if(batch.length>=100){ await putMany("blobs",batch); batch=[]; setProg(.03+.94*(done/totalPages)); }
    }
    if(batch.length) await putMany("blobs",batch);
    setProg(.03+.94*(done/totalPages));
    docs.push({ uid:u, key:d.key, name:d.name, group:d.group||"자료", side:d.side||"의뢰인", date:d.date, note:d.note, pages:d.pages, w:d.w, h:d.h,
                sentOn:pack.meeting.date, text:d.text||[], toc:d.toc||[], src:d.src||null, sha:d.sha });
    added++;
  }
  if(replaced.length) docs=docs.filter(x=>!replaced.includes(x.uid));
  (pack.known||[]).forEach(k=>{ const d=docs.find(x=>x.src===k.src); if(d){ if(k.key) d.key=k.key; if(k.name) d.name=k.name; if(k.group) d.group=k.group; if(k.side) d.side=k.side; if(k.note!=null) d.note=k.note; if(k.toc&&k.toc.length) d.toc=k.toc; } });
  const keys={}; docs.forEach(d=>{ if(d.key) keys[d.key]=d.uid; });
  const meta={ id:cid, name:pack.case.name, folder:pack.case.folder, caseNo:pack.case.caseNo, related:pack.case.related||[],
    meeting:pack.meeting, report:pack.report!=null?pack.report:(prev&&prev.report)||null, reportAt:pack.reportAt||(prev&&prev.reportAt)||null,
    glance:pack.glance||(prev&&prev.glance)||{}, qa:pack.qa||(prev&&prev.qa)||[], checks:pack.checks||(prev&&prev.checks)||{},
    builtAt:pack.builtAt, meetings:[...((prev&&prev.meetings)||[]),pack.meeting].filter((h,i,a)=>a.findIndex(x=>x.date===h.date)===i).sort((a,b)=>a.date<b.date?-1:1),
    docs, keys };
  await put("cases",cid,meta);
  setProg(1);
  await loadCases(cid);
  goTab("glance");
  toast(added?`자료 ${added}건 · ${totalPages}면 들어왔습니다`+(replaced.length?` · 옛 판 ${replaced.length}건 교체`:"")+` · 질문 ${(pack.qa||[]).length}`
             :`자료는 그대로 · 보고서·질문·체크를 갱신했습니다`,4200);
}
async function supersede(old,nu,npages){
  const keep=Math.min(old.pages||0,npages||0), hlOld=[], blobOld=[];
  for(let p=1;p<=(old.pages||0);p++){
    blobOld.push(old.uid+"#"+p); hlOld.push("hl:"+old.uid+"#"+p);
    if(p<=keep){ try{ const v=await get("hl","hl:"+old.uid+"#"+p); if(v&&v.length) await put("hl","hl:"+nu+"#"+p,v); }catch(e){} }
  }
  try{ await delMany("blobs",blobOld); await delMany("hl",hlOld); }catch(e){ console.error(e); }
}

function keyRegex(){
  const names=[]; Object.keys(S.keys).forEach(k=>{ names.push(k); const b=k.replace(/\d+$/,""); if(b&&b!==k&&!S.keys[b]) names.push(b); });
  if(!names.length) return null;
  names.sort((a,b)=>b.length-a.length);
  return new RegExp("("+names.map(n=>n.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")\\s*(\\d{1,4})면","g");
}
function keyUid(name){ if(S.keys[name]) return S.keys[name]; const k=Object.keys(S.keys).find(x=>x.replace(/\d+$/,"")===name); return k?S.keys[k]:null; }
function linkify(t){
  t=esc(t);
  t=t.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>");
  const re=keyRegex(); if(!re) return t;
  return t.replace(re,(m,name,p)=>{ const u=keyUid(name); return u?`<a class="pref" data-uid="${esc(u)}" data-p="${p}">${m}</a>`:m; });
}
function pageBtn(doc,p,label){ const u=S.keys[doc]; if(!u) return `<span class="pg" style="opacity:.5" title="이 자료가 아직 없습니다">${esc(label||doc+" "+p+"면")}</span>`;
  return `<button class="pg" data-uid="${esc(u)}" data-p="${p}">${esc(label||doc+" "+p+"면")}</button>`; }
function bindRefs(box){ box.querySelectorAll("[data-uid][data-p]").forEach(b=>b.onclick=()=>{ goTab("rec"); openDoc(b.dataset.uid,+b.dataset.p); }); }

/* ══ 보고서 ═══════════════════════════════════════════════════════ */
function mdToHtml(md){
  const lines=md.replace(/\r/g,"").split("\n"); let h="", list=null, para=[], table=null, quote=[];
  const flushP=()=>{ if(para.length){ h+=`<p>${linkify(para.join(" "))}</p>`; para=[]; } };
  const flushL=()=>{ if(list){ h+=`</${list}>`; list=null; } };
  const flushQ=()=>{ if(quote.length){ h+=`<blockquote>${quote.map(q=>`<p>${linkify(q)}</p>`).join("")}</blockquote>`; quote=[]; } };
  const flushT=()=>{ if(table){ h+="<table>"+table.map((r,i)=>"<tr>"+r.map(c=>`<${i?"td":"th"}>${linkify(c)}</${i?"td":"th"}>`).join("")+"</tr>").join("")+"</table>"; table=null; } };
  for(const raw of lines){
    const l=raw.trimEnd();
    if(/^\s*\|.*\|\s*$/.test(l)){ flushP(); flushL(); flushQ(); const cells=l.trim().slice(1,-1).split("|").map(c=>c.trim()); if(cells.every(c=>/^:?-{2,}:?$/.test(c))) continue; (table=table||[]).push(cells); continue; }
    flushT();
    if(/^<!--.*-->$/.test(l.trim())) continue;
    if(/^\s*(-{3,}|\*{3,})\s*$/.test(l)){ flushP(); flushL(); flushQ(); h+="<hr>"; continue; }
    let m;
    if((m=l.match(/^>\s?(.*)$/))){ flushP(); flushL(); if(m[1].trim()) quote.push(m[1]); continue; }
    flushQ();
    if(!l.trim()){ flushP(); flushL(); continue; }
    if((m=l.match(/^(#{1,4})\s+(.*)$/))){ flushP(); flushL(); h+=`<h${m[1].length}>${linkify(m[2])}</h${m[1].length}>`; continue; }
    if((m=l.match(/^\s+([가-힣])\.\s+(.*)$/))&&!para.length){ flushL(); h+=`<h4>${esc(m[1])}. ${linkify(m[2])}</h4>`; continue; }
    if((m=l.match(/^\s*[-*•]\s+(.*)$/))){ flushP(); if(list!=="ul"){ flushL(); list="ul"; h+="<ul>"; } h+=`<li>${linkify(m[1])}</li>`; continue; }
    if((m=l.match(/^\s*\d+[.)]\s+(.*)$/))){ flushP(); if(list!=="ol"){ flushL(); list="ol"; h+="<ol>"; } h+=`<li>${linkify(m[1])}</li>`; continue; }
    flushL(); para.push(l.trim());
  }
  flushP(); flushL(); flushQ(); flushT();
  return h;
}
function renderReport(){

  box.innerHTML=c.report?`<div class="sum">${mdToHtml(c.report)}<div class="meta">검토보고서 · ${esc((c.reportAt||"").replace("T"," "))}</div></div>`

  bindRefs(box);
}

      <span class="dot"></span><span class="t"><span class="tag">${i+1}${q.tag?" · "+esc(q.tag):""}</span>${esc(q.q)}</span></button>`; }).join("");
  list.querySelectorAll(".qitem").forEach(b=>b.onclick=()=>{ S.qid=b.dataset.q; box.classList.add("detail"); renderQA(); });

  det.innerHTML=`<div class="qcard">
    <div class="qh"><div class="tagline"><button class="btn ghost sm qback" id="qBack">‹ 목록</button><span class="tagchip ${esc(q.tag||"")}">${esc(q.tag||"질문")} ${qa.indexOf(q)+1}</span>
      ${st.asked?`<span class="tagchip" style="background:var(--ok-soft);color:var(--ok);border-color:transparent">물었음 ${st.t?hhmm(st.t):""}</span>`:""}
      ${st.flag?`<span class="tagchip" style="background:var(--warn-soft);color:var(--warn);border-color:transparent">확인 더 필요</span>`:""}</div>

async function addNote(){

async function noteAct(id,act){
  const n=S.notes.find(x=>x.id===id); if(!n) return;
  if(act==="del"){ S.notes=S.notes.filter(x=>x.id!==id); await put("notes",S.caseId,S.notes); renderNotes(); renderFollow(); counts(); return; }
  if(act==="req"){ n.req=!n.req; await put("notes",S.caseId,S.notes); renderNotes(); renderFollow(); counts(); toast(n.req?"받을 자료에 올렸습니다":"표시를 지웠습니다"); return; }
  if(act==="dec"){ n.dec=!n.dec; await put("notes",S.caseId,S.notes); renderNotes(); renderFollow(); counts(); toast(n.dec?"오늘 정한 것에 올렸습니다":"표시를 지웠습니다"); return; }

/* ══ 녹음 — 마이크가 열리면 MediaRecorder 로, 안 열리면 이유를 보인다 ═══ */
const REC={on:false, external:false, mr:null, stream:null, id:null, start:0, n:0, mime:"", timer:null, err:null, errName:"", playUrl:{}};
function recDiag(){ let framed=true; try{ framed=(window.top!==window.self); }catch(e){ framed=true; } return {framed, href:location.href}; }
async function recMeta(id){ return (await get("recmeta",id))||null; }
async function recMetaSave(fin){
  const m={id:REC.id, caseId:S.caseId, start:REC.start, end:fin?Date.now():null, n:REC.n, mime:REC.mime, dur:Math.round((Date.now()-REC.start)/1000), fin:!!fin, external:!!REC.external};
  await put("recmeta",REC.id,m); return m;
}
function recFail(msg,name){ REC.err=msg; REC.errName=name||""; renderAudio(); toast(msg,6000); }
/* 앱 밖 녹음(아이패드 음성 메모)과 맞추기 — 소리는 안 담고 시각만 잰다. 노트 줄의 ● 시각이 그 파일의 위치가 된다 */
function recStartExternal(){
  if(REC.on) return;
  REC.on=true; REC.external=true; REC.mr=null; REC.stream=null; REC.id="x"+Date.now().toString(36); REC.start=Date.now(); REC.n=0; REC.mime="external"; REC.err=null;
  recMetaSave(false);
  $("#recBadge").hidden=false; $("#recDot").hidden=false;
  REC.timer=setInterval(()=>{ const s=mmss((Date.now()-REC.start)/1000); $("#recBadge").textContent="● "+s; const t=$("#recTime"); if(t) t.textContent=s; },500);
  renderAudio();
  toast("지금 음성 메모의 녹음을 시작하세요 — 노트 줄마다 ● 시각이 남습니다",4000);
}
async function recStart(){
  if(REC.on) return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) return recFail("이 브라우저에는 마이크 API가 없습니다. 아이패드 「음성 메모」로 녹음해 주세요.");
  if(!window.MediaRecorder) return recFail("이 브라우저는 녹음(MediaRecorder)을 지원하지 않습니다. 아이패드 「음성 메모」로 녹음해 주세요.");
  let stream;
  try{ stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}); }
  catch(e){
    const why=(e&&e.name)||"";
    return recFail(why==="NotAllowedError"||why==="SecurityError"
      ?(recDiag().framed
        ?"마이크가 막혀 있습니다 — 이 화면은 claude.ai 틀 안에 떠 있어 iPad가 마이크를 열어 주지 않습니다. 「음성 메모와 맞추기」로 진행하세요."
        :"마이크 권한이 거부되어 있습니다 — 설정 › Safari › 마이크(홈 화면에 넣은 앱은 설정의 「상담노트」 항목)에서 허용한 뒤 다시 누르세요. 급하면 「음성 메모와 맞추기」.")
      :why==="NotFoundError"?"마이크를 찾지 못했습니다.":"마이크를 열지 못했습니다: "+(e.message||why), why);
  }
  const cand=["audio/mp4","audio/webm;codecs=opus","audio/webm",""];   /* 내려받기 허용 확장자가 mp4·webm 뿐이다 */
  const mime=cand.find(m=>!m||(MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m)));
  let mr; try{ mr=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream); }
  catch(e){ stream.getTracks().forEach(t=>t.stop()); return recFail("녹음기를 만들지 못했습니다: "+(e.message||e.name)); }
  REC.on=true; REC.mr=mr; REC.stream=stream; REC.id="r"+Date.now().toString(36); REC.start=Date.now(); REC.n=0; REC.err=null;
  REC.mime=mr.mimeType||mime||"audio/mp4";
  mr.ondataavailable=async ev=>{ if(!ev.data||!ev.data.size) return; try{ const buf=await ev.data.arrayBuffer(); REC.n++; await put("rec",REC.id+"#"+REC.n,buf); await recMetaSave(false); }catch(e){ console.error(e); } };
  mr.onerror=e=>{ recFail("녹음 중 오류: "+((e&&e.error&&e.error.message)||"알 수 없음")); };
  mr.onstop=async()=>{ try{ await recMetaSave(true); }catch(e){} REC.on=false; REC.mr=null; if(REC.stream){ REC.stream.getTracks().forEach(t=>t.stop()); REC.stream=null; }
    clearInterval(REC.timer); $("#recBadge").hidden=true; $("#recDot").hidden=true; renderAudio(); toast("녹음을 저장했습니다 — 녹음 탭에서 내려받을 수 있습니다",3500); };
  await recMetaSave(false);
  mr.start(10000);
  $("#recBadge").hidden=false; $("#recDot").hidden=false;
  REC.timer=setInterval(()=>{ const s=mmss((Date.now()-REC.start)/1000); $("#recBadge").textContent="● "+s; const t=$("#recTime"); if(t) t.textContent=s; },500);
  renderAudio();
  toast("녹음 시작 — 의뢰인에게 녹음 사실을 알리고 진행하세요",3500);
}
async function recStop(){
  if(!REC.on) return;
  if(REC.external){
    try{ await recMetaSave(true); }catch(e){}
    REC.on=false; REC.external=false; clearInterval(REC.timer);
    $("#recBadge").hidden=true; $("#recDot").hidden=true; renderAudio();
    toast("표시를 끝냈습니다 — 음성 메모도 지금 멈추세요",3500); return;
  }
  if(!REC.mr) return;
  try{ REC.mr.state!=="inactive"&&REC.mr.stop(); }catch(e){ console.error(e); }
}
async function recChunks(id){ const m=await recMeta(id); if(!m) return null; const parts=[]; for(let i=1;i<=m.n;i++){ const b=await get("rec",id+"#"+i); if(b) parts.push(b); } return {meta:m, blob:new Blob(parts,{type:m.mime||"audio/mp4"})}; }

          <div class="m">${mmss(m.dur||0)}${m.external?" · 소리는 음성 메모 앱에":` · ${m.n||0}조각 · ${esc(m.mime||"")}`}</div></div>

  const md=noteMarkdown(c,hl,recs);
  if(!downloads){
    modal({ title:"내려받기를 쓸 수 없습니다", sub:"이 화면에서는 파일 저장이 막혀 있습니다. 아래 글을 길게 눌러 복사하세요.",
      body:`<div class="field"><label>상담노트</label><textarea style="min-height:220px;font-family:var(--mono);font-size:12px">${esc(md)}</textarea></div>`, ok:"닫기", async onOk(){} });
    return;
  }
  try{ await downloads.save({filename:base+"_상담노트.md",data:md}); toast("내려받았습니다 — 파일 앱에서 드라이브로 옮기면 PC로 갑니다",4200); }
  catch(e){ if(e&&e.code!=="declined") toast("내려받기 실패: "+(e.message||e.code||e),4000); }
};
function noteMarkdown(c,hl,recs){
  const L=[], mt=c.meeting||{}, qa=c.qa||[], ck=c.checks||{}, g=c.glance||{};
  const cell=s=>String(s==null?"":s).replace(/\|/g,"\\|").replace(/\n/g," ");
  L.push(`# ${c.name||""}  상담노트`); L.push("");
  L.push(`- ${c.caseNo||"-"}`); (c.related||[]).forEach(r=>L.push(`- 관련 ${r}`));
  L.push(`- 상담 ${kdate(mt.date)} ${mt.time||""} ${mt.place||""} · ${mt.who||""} · ${mt.me||""}`.replace(/\s+/g," ").trim()); L.push("");
  if((g.개요||[]).length){ L.push("## 개요"); L.push(""); g.개요.forEach((x,i)=>L.push(`${i+1}. ${x}`)); L.push(""); }
  if((g.결정||[]).length){ L.push("## 의뢰인이 정한 것"); L.push(""); g.결정.forEach((x,i)=>{ const st=S.checks["dec:"+i]||{}; L.push(`- **${x.q}** — ${st.memo||"(미정)"}`); }); L.push(""); }
  const decs=S.notes.filter(n=>n.dec); if(decs.length){ L.push("## 상담 중 정한 것"); L.push(""); decs.forEach(n=>L.push(`- ${n.tx}  (${hhmm(n.t)} ${n.who})`)); L.push(""); }
  if(qa.length){ L.push("## 질문과 답"); L.push(""); L.push("| # | 질문 | 물었음 | 의뢰인 답 | 비고 |"); L.push("|---|---|---|---|---|");
    qa.forEach((q,i)=>{ const st=S.qa[q.id]||{}; L.push(`| ${i+1} | ${cell(q.q)} | ${st.asked?"○"+(st.t?" "+hhmm(st.t):""):"—"} | ${cell(st.actual||"")} | ${st.flag?"확인 더 필요":""} |`); }); L.push(""); }
  const reqs=S.notes.filter(n=>n.req); const reqck=(ck.요청||[]);
  if(reqs.length||reqck.length){ L.push("## 의뢰인에게 받을 자료"); L.push(""); reqck.forEach(i=>L.push(`- [${(S.checks[i.id]||{}).done?"x":" "}] ${i.tx}`)); reqs.forEach(n=>L.push(`- [ ] ${n.tx}  (${hhmm(n.t)})`)); L.push(""); }
  L.push("## 진행"); L.push(""); L.push("| 시각 | 녹음 | 발언 | 내용 |"); L.push("|---|---|---|---|");
  S.notes.forEach(n=>L.push(`| ${hhmm(n.t)} | ${n.rec?mmss(n.rec.off):""} | ${n.who} | ${cell(n.tx)}${n.req?" ✎자료":""}${n.dec?" ★결정":""}${n.todo?" ☑후속":""} |`));
  L.push("");
  const follow=[...(ck.후속||[]).map(i=>({tx:i.tx,due:i.due,done:(S.checks[i.id]||{}).done})),...S.todos];
  if(follow.length){ L.push("## 상담 뒤에 할 일"); L.push(""); follow.forEach(t=>L.push(`- [${t.done?"x":" "}] ${t.tx}${t.due?`  —  ${kdate(t.due)}`:""}`)); L.push(""); }
  if((recs||[]).length){ L.push("## 녹음"); L.push(""); recs.forEach(m=>L.push(`- ${kdate(new Date(m.start).toISOString().slice(0,10))} ${hhmm(m.start)} · ${mmss(m.dur||0)} · ${m.external?"음성 메모와 맞춤 (소리는 음성 메모 파일)":(m.mime||"")}${m.fin?"":" · 중단됨"}`)); L.push(""); }
  if(hl&&Object.keys(hl).length){ L.push("## 형광펜 표시한 면"); L.push(""); Object.keys(hl).forEach(n=>L.push(`- ${n}: ${hl[n].join(", ")}면`)); L.push(""); }
  if(S.docs.length){ L.push("## 가져간 자료"); L.push(""); S.docs.forEach(d=>L.push(`- ${d.name} (${d.pages}면)`)); }
  return L.join("\n");
}

/* ══ 모달 ═════════════════════════════════════════════════════════ */
let _mOk=null;
function modal({title,sub,body,ok,danger,onOk,onOpen}){
  $("#mTitle").textContent=title; $("#mSub").textContent=sub||""; $("#mSub").hidden=!sub; $("#mBody").innerHTML=body||"";
  $("#mFoot").innerHTML=`<button class="btn" id="mCancel">취소</button><button class="btn ${danger?"seal":"primary"}" id="mOk">${esc(ok||"확인")}</button>`;
  $("#scrim").classList.add("on"); $("#mCancel").onclick=closeModal; _mOk=onOk;
  $("#mOk").onclick=async()=>{ const r=_mOk?await _mOk():undefined; if(r!==false) closeModal(); };
  if(onOpen) onOpen();
  const f=$("#mBody").querySelector("input,textarea,select"); if(f) setTimeout(()=>f.focus(),40);
}
function closeModal(){ $("#scrim").classList.remove("on"); _mOk=null; }
$("#scrim").onclick=e=>{ if(e.target===$("#scrim")) closeModal(); };
document.addEventListener("keydown",e=>{
  if(e.key==="Escape") closeModal();
  if(!S.doc) return;
  const tag=(document.activeElement||{}).tagName; if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT") return;
  if(!$("#pane-rec").classList.contains("on")) return;
  if(e.key==="ArrowLeft") showPage(S.page-1); if(e.key==="ArrowRight") showPage(S.page+1);
});

/* ══ 탭 · 집계 ════════════════════════════════════════════════════ */
$$(".tab").forEach(t=>t.onclick=()=>{
  $$(".tab").forEach(x=>x.setAttribute("aria-selected",String(x===t)));
  $$(".pane").forEach(p=>p.classList.toggle("on",p.id==="pane-"+t.dataset.t));
  if(t.dataset.t==="note") setTimeout(()=>{ const b=$("#noteScroll"); b.scrollTop=b.scrollHeight; },30);
  if(t.dataset.t==="rec"&&S.doc&&ZOOMS[S.zoomIdx]==="fit") setTimeout(applyZoom,30);
  if(t.dataset.t==="audio") renderAudio();
});
function counts(){
  const c=cur(), qa=c.qa||[], ck=c.checks||{};
  $("#nQa").textContent=`${qa.filter(q=>(S.qa[q.id]||{}).asked).length}/${qa.length}`;
  $("#nRec").textContent=S.docs.length;
  $("#nNote").textContent=S.notes.length;
  $("#nFollow").textContent=(ck.후속||[]).filter(i=>!(S.checks[i.id]||{}).done).length+S.todos.filter(t=>!t.done).length;
}
async function renderAll(){ renderGlance(); renderReport(); renderQA(); renderDocs(); renderNotes(); renderFollow(); counts(); await renderAudio(); }

loadCases().catch(err=>{ console.error(err);
  document.querySelector(".main").innerHTML=`<div class="empty"><h2>저장소를 열 수 없습니다</h2><p>사파리 개인정보 보호 모드에서는 기록을 저장할 수 없습니다. 일반 창에서 열어 주세요.</p></div>`; });
</script>
